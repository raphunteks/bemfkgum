<body itemscope itemtype="https://schema.org/WebPage">

    <script>
        // MOCK DATA: Hanya berjalan di Canvas Simulator untuk keperluan Development UI.
        const PREVIEW_MOCK_DATA = {
            id: "pubmed", dept: "DEPT. INFOCOM", namaProker: "PUBMED",
            bgImage: "/img/bannerprokerdeskripsi.png", fotoPengurus: "/img/bemfkgumi.png",
            shortDesc: "Membuat konten-konten menarik yang memuat tentang informasi (berita, pemberitahuan, peringatan hari besar, isu-isu yang berkembang)...",
            sasaranPeserta: "Ruang lingkup internal hingga eksternal FKG-UMI.",
            targetPelaksanaan: "Triwulan I", startDate: "2026-01-01", endDate: "2026-12-31", performer: "Pengurus Dept. Infocom", anggaran: "7000000",
            koordinator: "Silviyananda", penanggungJawab: "Silvy Ananda, Muh. Syauqi Zahran. B, Daegal Fauza Iryanto",
            latarBelakang: "Memasuki Era Revolusi Industri 5.0 yang lebih menitik beratkan pada pengembangan teknologi...",
            tujuan: "Memberikan kemudahan akses informasi yang cepat dan akurat...",
            swot: "Strength: Tim yang solid dan melek teknologi...\nWeakness: Keterbatasan alat dokumentasi...",
            parameterKeberhasilan: "Semua media informasi dapat memberikan konten..."
        };

        // Helper Konversi Tanggal ISO 8601 Valid GSC
        function createValidISODate(dateStr, defaultTime) {
            if (!dateStr) return new Date().toISOString(); 
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return new Date().toISOString();
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}T${defaultTime}+08:00`; 
            } catch (e) {
                return new Date().toISOString();
            }
        }

        // Helper untuk membuang dan membuat ulang elemen <meta>
        function updateMeta(nameOrProperty, attrName, value) {
            let meta = document.querySelector(`meta[${nameOrProperty}="${attrName}"]`);
            if (!meta) {
                meta = document.createElement('meta');
                meta.setAttribute(nameOrProperty, attrName);
                document.head.appendChild(meta);
            }
            meta.setAttribute('content', value);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const isPreview = window.location.protocol === 'blob:' || window.location.origin === "null" || window.location.protocol === 'file:';
            
            // Relative Path API Call
            let apiUrl = '/api/content'; 
            if (isPreview) apiUrl = 'https://bemkbmfkgumi.com/api/content';
            
            // Mengambil Slug
            const urlParams = new URLSearchParams(window.location.search);
            let slug = window.location.pathname.split('/').filter(Boolean).pop();
            
            if(!slug || slug === 'proker-deskripsi') {
                slug = urlParams.get('id');
            }

            if (!slug && !isPreview) {
                showErrorState("URL Tidak Valid", "Mohon maaf, tautan ini tidak memiliki parameter ID Departemen yang sah.");
                return;
            }

            let deptData = null;
            let allOrgDept = [];
            
            try {
                const req = await fetch(apiUrl);
                if(!req.ok) throw new Error("Gagal terhubung ke Database Server (HTTP " + req.status + ").");
                
                const res = await req.json();
                const allProker = res.proker || [];
                allOrgDept = (res.org || {}).departemen || [];
                
                deptData = allProker.find(p => p.id === slug || p.slug === slug);
                
                if(!deptData) {
                    throw new Error("Data program kerja tidak tersedia di database.");
                }

                renderDetail(deptData, allOrgDept, slug);

            } catch (err) {
                if (isPreview) {
                    console.info("🛠️ [SIMULATOR]: Koneksi ke API terblokir. Merender UI dengan data Simulasi.");
                    renderDetail(PREVIEW_MOCK_DATA, [], PREVIEW_MOCK_DATA.id);
                    return;
                }
                console.warn("[SISTEM]: Terjadi kendala saat mengambil data.", err.message);
                showErrorState("Oops! Terjadi Kesalahan", "Koneksi ke database terputus. Pastikan koneksi internet Anda stabil atau server sedang aktif.");
            }
        });

        function showErrorState(title, message) {
            document.getElementById('mainContent').innerHTML = `
                <div style="text-align:center; padding: 100px 0; animation: fadeInTab 0.5s ease;">
                    <div style="width: 70px; height: 70px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                        <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    </div>
                    <h2 style="font-size: 2.2rem; color: #ef4444; margin-bottom: 10px;">${title}</h2>
                    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; max-width: 600px; margin-left: auto; margin-right: auto;">${message}</p>
                    <a href="/informasi#proker" class="holo-btn">Kembali ke Pusat Informasi</a>
                </div>
            `;
        }

        function formatDateToDDMMYYYY(dateString) {
            if (!dateString) return '-';
            const parts = dateString.split('-');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return dateString;
        }

        // ================= FUNGSI RENDER UTAMA UI =================
        function renderDetail(data, orgDepartemen, slug) {
            const baseUrl = "https://bemkbmfkgumi.com";
            
            // Set Default Gambar
            let bgImg = baseUrl + '/img/bannerprokerdeskripsi.png';
            if (data.bgImage) {
                bgImg = (data.bgImage.startsWith('http') || data.bgImage.startsWith('data:')) ? data.bgImage : baseUrl + data.bgImage;
            } else if (data.fotoPengurus) {
                bgImg = (data.fotoPengurus.startsWith('http') || data.fotoPengurus.startsWith('data:')) ? data.fotoPengurus : baseUrl + data.fotoPengurus;
            }

            // Generate Struktur Pengurus
            let strukturHtml = '';
            let deptStructure = null;
            if(orgDepartemen && orgDepartemen.length > 0) {
               deptStructure = orgDepartemen.find(d => d.nama === data.dept);
            }

            if (deptStructure && deptStructure.anggota && deptStructure.anggota.length > 0) {
                strukturHtml = `<div class="dept-team-grid">`;
                deptStructure.anggota.forEach(ang => {
                    const angPic = ang.foto ? (ang.foto.startsWith('http') || ang.foto.startsWith('data:') ? ang.foto : baseUrl + ang.foto) : baseUrl + '/img/bemfkgumi.png';
                    strukturHtml += `
                        <div class="dept-member-card">
                            <img src="${angPic}" alt="${ang.nama}" class="dept-member-photo" loading="lazy" width="80" height="80">
                            <h4 class="dept-member-name">${ang.nama}</h4>
                            <p class="dept-member-role">${ang.jabatan}</p>
                        </div>
                    `;
                });
                strukturHtml += `</div>`;
            } else {
                strukturHtml = `
                    <div style="margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed var(--border-light);">
                        <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; font-weight: 600;">Koordinator Departemen</span>
                        <strong style="color: var(--accent-neon); font-size: 1.2rem;">${data.koordinator || '-'}</strong>
                    </div>
                    <div>
                        <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; font-weight: 600;">Anggota / Penanggung Jawab Proker</span>
                        <p style="color: var(--text-muted); line-height: 1.8; font-weight: 500;">
                            ${data.penanggungJawab ? data.penanggungJawab.replace(/,/g, '<br>• ') : '-'}
                        </p>
                    </div>
                `;
            }

            const deptText = data.dept ? data.dept.toUpperCase() : '';
            const prokerText = data.namaProker ? data.namaProker.toUpperCase() : '';
            const titleBanner = prokerText ? `${deptText} - ${prokerText}` : deptText;

            const formattedStart = formatDateToDDMMYYYY(data.startDate);
            const formattedEnd = formatDateToDDMMYYYY(data.endDate);

            // Inject Konten Keseluruhan ke DOM
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="proker-banner-wrapper reveal active">
                    <img src="${bgImg}" alt="Banner ${data.dept}" class="proker-banner-img" width="1920" height="1080" fetchpriority="high">
                    <div class="proker-banner-overlay" style="z-index: 2;">
                        <div class="clay-badge" style="margin-bottom: 15px; font-size:0.75rem; background: rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.2);">DESKRIPSI PROGRAM KERJA</div>
                        <h2 class="banner-title-text">${titleBanner}</h2>
                        <p class="banner-desc-text">${data.shortDesc || ''}</p>
                    </div>
                </div>

                <div class="grid-2" style="margin-bottom: 40px; grid-template-columns: 1fr 380px; gap: 40px;">
                    <div class="proker-main-col">
                        <div id="latar-belakang" class="glass-card reveal active" style="margin-bottom: 35px; scroll-margin-top: 100px;">
                            <h2 class="detail-section-title">Latar Belakang / Bentuk Kegiatan</h2>
                            <p style="color:var(--text-muted); line-height:1.8; font-size:1.05rem; white-space: pre-wrap;">${data.latarBelakang || '-'}</p>
                        </div>
                        <div id="tujuan" class="glass-card reveal active" style="margin-bottom: 35px; scroll-margin-top: 100px;">
                            <h2 class="detail-section-title">Tujuan Kegiatan</h2>
                            <p style="color:var(--text-muted); line-height:1.8; font-size:1.05rem; white-space: pre-wrap;">${data.tujuan || '-'}</p>
                        </div>
                        <div id="swot" class="glass-card reveal active" style="margin-bottom: 35px; scroll-margin-top: 100px;">
                            <h2 class="detail-section-title">Analisis SWOT</h2>
                            <p style="color:var(--text-muted); line-height:1.8; font-size:1.05rem; white-space: pre-wrap;">${data.swot || '-'}</p>
                        </div>
                        <div id="parameter-keberhasilan" class="glass-card reveal active" style="margin-bottom: 35px; scroll-margin-top: 100px;">

                        </div>
                    </div>

                    <div class="proker-sidebar-col">

                            <h2 class="detail-section-title" style="border-left-color: #10b981; font-size: 1.4rem;">Detail Operasional</h2>
                            <div class="info-row">
                                <div style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; color: #ef4444; background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.2);" aria-hidden="true">🎯</div>
                                <div>

                                    <strong style="color: var(--text-light); font-size: 1.05rem;">${data.sasaranPeserta || 'Kondisional'}</strong>
                                </div>

                                <div style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; color: var(--accent-neon); background: var(--bg-dark-overlay); border: 1px solid var(--accent-glow);" aria-hidden="true">⏱️</div>
                                <div>
                                    <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; font-weight: 600;">Target Pelaksanaan</span>
                                    <strong style="color: var(--text-light); font-size: 1.05rem;">${data.targetPelaksanaan || 'Sepanjang Periode'}</strong>
                                </div>
                            </div>
                            <div class="info-row">
                                <div style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; color: #a855f7; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.2);" aria-hidden="true">📅</div>
                                <div>
                                    <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; font-weight: 600;">Periode Tanggal</span>

                                </div>
                            </div>
                            <div class="info-row">
                                <div style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; color: #eab308; background: rgba(234, 179, 8, 0.1); border: 1px solid rgba(234, 179, 8, 0.2);" aria-hidden="true">💰</div>
                                <div>
                                    <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; font-weight: 600;">Rancangan Anggaran Dana</span>
                                    <strong style="color: var(--text-light); font-size: 1.05rem;">${data.anggaran || 'Rp. 0,-'}</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card reveal active" id="struktur-pengurus" style="padding: 35px; margin-bottom: 30px; scroll-margin-top: 100px;">
                     <h2 class="detail-section-title" style="border-left-color: #8b5cf6;">Struktur Pengurus Departemen</h2>
                     <p style="color: var(--text-muted); margin-bottom: 25px;">Para punggawa penggerak program kerja di departemen ini.</p>
                     ${strukturHtml}
                </div>
                
                <div style="text-align: center; margin-top: 50px;">
                    <a href="/informasi#proker" class="glass-btn">&larr; Kembali ke Pusat Informasi</a>
                </div>
            `;

            // Eksekusi Pembangkitan SEO
            generateDynamicSEO(data, slug, titleBanner, bgImg, baseUrl);
        }

        // =========================================================
        // SUPER UPGRADE: DYNAMIC JSON-LD GENERATOR (100% GSC VALID)
        // =========================================================
        function generateDynamicSEO(data, slug, titleBanner, imgUrl, baseUrl) {
            const finalSlug = data.slug || data.id || slug;
            const pageUrl = `${baseUrl}/proker-deskripsi/${finalSlug}`;
            
            const isPreview = window.location.protocol === 'blob:' || window.location.origin === "null" || window.location.protocol === 'file:';
            if (window.location.search.includes('id=') && !isPreview) {
                window.history.replaceState({}, '', `/proker-deskripsi/${finalSlug}`);
            }

            const deptText = data.dept ? data.dept.toUpperCase() : 'DEPARTEMEN';
            const prokerText = data.namaProker ? data.namaProker.toUpperCase() : 'PROGRAM KERJA';
            
            const pageTitle = `${deptText} - Department Profile | BEM KBMFKG UMI`;
            document.title = pageTitle;
            
            const descText = data.shortDesc ? (data.shortDesc.substring(0, 155) + '...') : `Informasi detail mengenai program kerja dan struktur kepengurusan dari ${data.dept} BEM KBMFKG UMI.`;

            // Update HTML Meta Tags
            updateMeta('name', 'description', descText);
            
            let canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
                canonicalLink = document.createElement('link');
                canonicalLink.setAttribute('rel', 'canonical');
                document.head.appendChild(canonicalLink);
            }
            canonicalLink.setAttribute('href', pageUrl);

            updateMeta('property', 'og:url', pageUrl);
            updateMeta('property', 'og:title', pageTitle);
            updateMeta('property', 'og:description', descText);
            updateMeta('property', 'og:image', imgUrl);
            
            updateMeta('property', 'twitter:title', pageTitle);
            updateMeta('property', 'twitter:description', descText);
            updateMeta('property', 'twitter:url', pageUrl);
            updateMeta('property', 'twitter:image', imgUrl);

            // Sanitasi Strict untuk Google Schema (Event)
            let priceValue = "0";
            if (data.anggaran && data.anggaran.toLowerCase() !== 'gratis') {
                priceValue = data.anggaran.replace(/[^0-9]/g, '') || "0";
            }
            
            const startDateISO = createValidISODate(data.startDate, "08:00:00");
            const endDateISO = createValidISODate(data.endDate || data.startDate, "17:00:00");
            
            const fullSEO_Description = `${data.shortDesc || ''} Latar Belakang: ${data.latarBelakang || '-'} Tujuan: ${data.tujuan || '-'} Parameter Keberhasilan: ${data.parameterKeberhasilan || '-'}`.substring(0, 4500);

            try {
                // MURNI SESUAI INSTRUKSI: Format @graph yang Komprehensif
                const schemaGraph = [
                    {
                        "@type": "AboutPage",
                        "@id": `${pageUrl}/#webpage`,
                        "name": pageTitle,
                        "description": descText,
                        "url": pageUrl,
                        "inLanguage": "id-ID",
                        "publisher": { "@id": `${baseUrl}/#organization` }
                    },
                    {
                        "@type": "Event",
                        "@id": `${pageUrl}/#event`,
                        "name": titleBanner,
                        "description": fullSEO_Description,
                        "url": pageUrl,
                        "image": imgUrl,
                        "eventStatus": "https://schema.org/EventScheduled",
                        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
                        "startDate": startDateISO,
                        "endDate": endDateISO,
                        "location": {
                            "@type": "Place",
                            "name": data.sasaranPeserta || "Ruang lingkup internal hingga eksternal FKG-UMI.",
                            "address": {
                                "@type": "PostalAddress",
                                "addressLocality": "Makassar",
                                "addressRegion": "Sulawesi Selatan",
                                "addressCountry": "ID"
                            }
                        },
                        "organizer": {
                            "@type": "Organization",
                            "name": "BEM KBMFKG UMI",
                            "url": baseUrl
                        },
                        "performer": {
                            "@type": "Organization",
                            "name": data.performer || `Pengurus ${data.dept || 'Departemen'}`
                        },
                        "offers": {
                            "@type": "Offer",
                            "price": priceValue,
                            "priceCurrency": "IDR",
                            "url": pageUrl,
                            "validFrom": new Date().toISOString().split('T')[0],
                            "availability": "https://schema.org/InStock"
                        }
                    },
                    {
                        "@type": "Organization",
                        "@id": `${baseUrl}/#organization`,
                        "name": "BEM KBMFKG UMI",
                        "alternateName": "Badan Eksekutif Mahasiswa Fakultas Kedokteran Gigi Universitas Muslim Indonesia",
                        "url": baseUrl,
                        "logo": {
                            "@type": "ImageObject",
                            "url": `${baseUrl}/img/bemfkgumi.png`
                        }
                    },
                    {
                        "@type": "BreadcrumbList",
                        "@id": `${pageUrl}/#breadcrumb`,
                        "itemListElement": [
                            { "@type": "ListItem", "position": 1, "name": "Beranda", "item": baseUrl },
                            { "@type": "ListItem", "position": 2, "name": "Program Kerja (Work Programs)", "item": `${baseUrl}/informasi#proker` },
                            { "@type": "ListItem", "position": 3, "name": deptText, "item": pageUrl }
                        ]
                    }
                ];

                const schemaScript = document.getElementById('structuredData') || document.createElement('script');
                schemaScript.id = 'structuredData';
                schemaScript.type = 'application/ld+json';
                
                schemaScript.text = JSON.stringify({
                    "@context": "https://schema.org",
                    "@graph": schemaGraph
                });
                
                if (!document.getElementById('structuredData')) {
                    document.head.appendChild(schemaScript);
                }
                
                if (window.location.hash) {
                    const targetId = window.location.hash.substring(1);
                    const target = document.getElementById(targetId);
                    if (target) {
                        setTimeout(() => {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 500);
                    }
                }
            } catch (e) {
                console.warn("Sistem SEO Terjadi Peringatan (Diabaikan):", e.message);
            }
        }
    </script>
</body>
</html>
