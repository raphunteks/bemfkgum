<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Radar BEM - BEM KBMFKG UMI</title>
    
    <!-- PROTECT DEVTOOLS -->
    <script src="/js/protect-devtools.js"></script>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Pantau update kegiatan, dokumentasi, dan feed Instagram terbaru secara real-time dari departemen-departemen di BEM KBMFKG UMI melalui Radar BEM.">
    <meta name="keywords" content="Radar BEM, Instagram BEM FKG UMI, Feed Kegiatan BEM, Dokumentasi BEM FKG UMI">
    <meta name="author" content="BEM KBMFKG UMI">
    <link rel="canonical" href="https://bemkbmfkgumi.com/radarbem">
    
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <!-- MAIN CSS -->
    <link rel="stylesheet" href="/css/main.css">
    
    <style>
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.6s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <%- include('partials/header.html') %>
    
    <main class="container" style="padding-top: 80px; padding-bottom: 80px; min-height: 80vh;">
        <!-- Header Page -->
        <div class="reveal" style="text-align: center; margin-bottom: 50px;">
            <div class="clay-badge">EKSPLORASI KEGIATAN</div>
            <h1 style="font-size: 3rem; margin-top: 15px; font-weight: 900; color: var(--text-light);">Radar <span style="color: var(--accent-neon);">BEM</span></h1>
            <p style="color: var(--text-muted); margin-top: 15px; font-size: 1.1rem; max-width: 600px; margin-left: auto; margin-right: auto;">
                Pantau terus update kegiatan, dokumentasi, dan umpan media sosial secara *real-time* dari seluruh Departemen BEM KBMFKG UMI.
            </p>
        </div>

        <!-- Container Widget Instagram -->
        <div id="radarContainer" class="reveal">
            <div style="text-align:center; padding:50px; color:var(--text-muted);">
                <div class="loader-ring"></div>
                <p>Memuat Radar BEM...</p>
            </div>
        </div>
    </main>

    <%- include('partials/footer.html') %>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let apiUrl = '/api/content';
            if(window.location.protocol === 'blob:' || window.location.origin === "null") {
                apiUrl = 'https://bemkbmfkgumi.com/api/content';
            }

            fetch(apiUrl).then(r => r.json()).then(res => {
                const container = document.getElementById('radarContainer');
                container.innerHTML = ''; // Hapus loading spinner

                if(res.radar && res.radar.length > 0) {
                    res.radar.forEach((item, index) => {
                        // Membuat wrapper estetis untuk feed
                        const card = document.createElement('div');
                        card.className = 'radar-feed-card reveal';
                        if (index === 0) card.classList.add('active'); // Tampilkan yang pertama langsung
                        
                        const header = document.createElement('div');
                        header.className = 'radar-feed-header';
                        header.innerHTML = `
                            <h3 class="radar-feed-title">${item.departemen}</h3>
                            <p class="radar-feed-subtitle">Ikuti *update* kegiatan dan dokumentasi terbaru dari departemen kami langsung melalui feed di bawah.</p>
                        `;
                        
                        const widgetWrapper = document.createElement('div');
                        widgetWrapper.className = 'radar-widget-container';
                        widgetWrapper.innerHTML = item.embed; // Inject kode Elfsight

                        card.appendChild(header);
                        card.appendChild(widgetWrapper);
                        container.appendChild(card);

                        // EKSEKUSI SCRIPT: Inject innerHTML saja tidak memicu script (<script src="...">).
                        // Jadi kita harus melakukan re-append untuk tag <script> yang didapat dari Database API.
                        const scripts = widgetWrapper.querySelectorAll('script');
                        scripts.forEach(oldScript => {
                            const newScript = document.createElement('script');
                            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            if(oldScript.innerHTML) newScript.innerHTML = oldScript.innerHTML;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                    });
                } else {
                    container.innerHTML = `
                    <div class="glass-card" style="text-align:center; padding: 50px;">
                        <p style="color:var(--text-muted); font-size:1.1rem;">Belum ada integrasi feed media sosial yang ditambahkan oleh Admin.</p>
                    </div>`;
                }

                // Inisialisasi Ulang Animasi Reveal untuk Elemen Baru
                const observer = new IntersectionObserver(entries => entries.forEach(e => { 
                    if(e.isIntersecting) { e.target.classList.add('active'); observer.unobserve(e.target); }
                }), { threshold: 0.15 });
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

            }).catch(e => {
                document.getElementById('radarContainer').innerHTML = `
                <div class="glass-card error-box" style="text-align:center; padding: 30px;">
                    ⚠️ Gagal memuat data dari server.
                </div>`;
            });

            // Animasi Awal Header & Footer
            const observer = new IntersectionObserver(entries => entries.forEach(e => { 
                if(e.isIntersecting) { e.target.classList.add('active'); observer.unobserve(e.target); }
            }), { threshold: 0.15 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
