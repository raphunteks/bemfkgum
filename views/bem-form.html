<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir - BEM KBMFKG UMI (Futuristic Edition)</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Oswald:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mainV2.css">
    
    <script src="/js/protect-devtools.js"></script>

    <style>
        body.public-form-body { background: var(--form-bg); font-family: var(--form-font-text); display: block !important; }
        .form-title { font-family: var(--form-font-header) !important; }
        .question-title { font-family: var(--form-font-question) !important; }
        .form-desc, .gf-input, .opt-text, .step-name { font-family: var(--form-font-text) !important; }

        /* SUPER UPGRADE: CSS untuk Ekstra Fitur (Bintang Hover, Matrix Grid) */
        .star-icon { transition: all 0.3s; }
        .star-rating-wrapper label { cursor: pointer; }
        
        .grid-table-wrapper::-webkit-scrollbar { height: 8px; }
        .grid-table-wrapper::-webkit-scrollbar-thumb { background: var(--form-active-border); border-radius: 4px; }
        .grid-table-wrapper::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
    </style>
</head>
<body class="public-form-body">
    <%- include('partials/header.html') %>

    <main class="form-wrapper" id="publicFormWrapper">
        <div style="text-align:center; padding: 150px 20px;">
            <div class="loader-ring glow-effect" style="border-color:var(--form-active-border); border-top-color:transparent;"></div>
            <p style="color:var(--form-text); font-size:1.2rem; font-weight:700; margin-top:25px; letter-spacing:1px; animation: pulse 2s infinite;">Memuat Sistem BEM...</p>
        </div>
    </main>

    <%- include('partials/footer.html') %>

    <!-- GLOBAL LISTENER UNTUK INTERAKSI KOMPLEKS SEPERTI RATING & FILE UPLOAD -->
    <script>
        document.addEventListener('change', function(e) {
            // EVENT BINTANG (RATING)
            if (e.target && e.target.type === 'radio' && e.target.closest('.star-rating-wrapper')) {
                const wrapper = e.target.closest('.star-rating-wrapper');
                const val = parseInt(e.target.value);
                wrapper.querySelectorAll('label').forEach((lbl, idx) => {
                    const svg = lbl.querySelector('svg');
                    if(idx < val) { svg.setAttribute('fill', '#f59e0b'); svg.setAttribute('stroke', '#f59e0b'); }
                    else { svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); }
                });
            }
            
            // EVENT NAMA FILE (UPLOAD)
            if (e.target && e.target.type === 'file') {
                const display = e.target.nextElementSibling;
                if (display && display.classList.contains('file-names-display')) {
                    const files = Array.from(e.target.files).map(f => f.name).join(', ');
                    display.innerText = files || 'Tidak ada file dipilih.';
                }
            }
        });
    </script>

    <script>
        const pathArray = window.location.pathname.split('/');
        const slug = pathArray[pathArray.length - 1];
        let formData = null;
        let currentStep = 0;

        document.addEventListener('DOMContentLoaded', loadPublicForm);

        async function loadPublicForm() {
            try {
                const res = await fetch(`/api/forms/${slug}`);
                const json = await res.json();
                
                if(!json.success || !json.data) { return renderError("Data Anomali! Formulir tidak ditemukan di server atau URL tidak sah."); }
                
                formData = json.data;
                if (!formData.settings) formData.settings = {};
                
                if(formData.theme) {
                    const t = formData.theme;
                    document.documentElement.style.setProperty('--form-active-border', t.color);
                    document.documentElement.style.setProperty('--form-bg', t.bgColor);
                    document.documentElement.style.setProperty('--form-font-header', `"${t.headerFont}", sans-serif`);
                    document.documentElement.style.setProperty('--form-font-question', `"${t.questionFont}", sans-serif`);
                    document.documentElement.style.setProperty('--form-font-text', `"${t.textFont}", sans-serif`);
                }
                
                if(formData.isActive === false) { return renderError("Sesi Berakhir. Formulir ini telah ditutup oleh Administrator BEM."); }
                if(formData.settings.deadline) {
                    const now = new Date(); const deadlineDate = new Date(formData.settings.deadline);
                    if(now > deadlineDate) {
                        const dateStr = deadlineDate.toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                        return renderError(`Batas Waktu Terlampaui. Sistem otomatis menutup formulir pada <strong style="color:var(--form-active-border); display:block; margin-top:15px; font-size:1.4rem;">${dateStr} WITA</strong>`);
                    }
                }

                renderFormHTML(); initAutoSave();
            } catch(e) { renderError("Gangguan Koneksi. Gagal terhubung ke database cloud BEM."); }
        }

        function renderError(msg) {
            document.getElementById('publicFormWrapper').innerHTML = `<div class="form-header-card glass-card neumorph-outer" style="border-top:8px solid #ef4444; text-align:center; padding: 70px 40px; margin-top:50px;"><div class="glow-effect" style="font-size: 4rem; margin-bottom: 25px; display:inline-block; filter: drop-shadow(0 0 20px rgba(239,68,68,0.5));">🛑</div><h2 class="form-title" style="color:#ef4444; font-size:2.2rem; font-weight:800; margin-bottom:20px;">AKSES TERKUNCI</h2><p class="form-desc" style="font-size:1.2rem; color:var(--form-text); line-height:1.6;">${msg}</p><button class="gf-btn-clear neumorph-btn" style="margin-top:40px; font-size:1.1rem; color:#ef4444;" onclick="window.location.href='/'">🔙 Kembali ke Portal Utama</button></div>`;
        }

        function renderFormHTML() {
            const wrapper = document.getElementById('publicFormWrapper');
            const theme = formData.theme || {};
            const settings = formData.settings;
            
            let headerImgStyle = theme.headerImage ? `background-image: url('${theme.headerImage}');` : 'background: linear-gradient(135deg, var(--form-active-border), transparent);';
            let headerClass = theme.headerImage ? 'has-image' : 'no-image';

            let warningHTML = '';
            if(settings.deadline) {
                const dl = new Date(settings.deadline);
                const strDl = dl.toLocaleString('id-ID', {day: 'numeric', month: 'short', hour:'2-digit', minute:'2-digit'});
                warningHTML = `<div class="deadline-badge glass-panel glow-effect">⏳ Auto-Close: ${strDl} WITA</div>`;
            }
            
            let draftInfoHTML = !settings.disableAutoSave ? `<div style="display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--form-text-muted); margin-top:15px; padding-top:15px; border-top:1px solid rgba(255,255,255,0.2);"><span style="color:#10b981;">☁️</span> Draf disimpan secara otomatis ke browser Anda</div>` : '';

            let html = `<form id="submissionForm" onsubmit="submitForm(event)">`;

            if (formData.sections && formData.sections.length > 1) {
                html += `<div class="stepper-wrapper glass-panel neumorph-outer" style="margin-bottom:30px;">`;
                formData.sections.forEach((sec, idx) => {
                    let safeStepName = sec.stepName && sec.stepName.trim() !== '' ? sec.stepName : 'Tahap '+(idx+1);
                    html += `<div class="stepper-item ${idx === 0 ? 'active' : ''}" id="stepper-item-${idx}"><div class="step-counter glow-effect">${idx + 1}</div><div class="step-name" style="font-size:${theme.textFontSize}px;">${safeStepName}</div></div>`;
                });
                html += `</div>`;
            }

            html += `<div class="form-step active" id="step-0">`;
            html += `<div class="form-header-banner ${headerClass}" style="${headerImgStyle}"></div><div class="form-header-card glass-card neumorph-outer rounded-top-none main-hero-card"><h1 class="form-title gradient-text" style="font-size:${theme.headerFontSize || 28}px;">${formData.title}</h1><p class="form-desc" style="white-space: pre-line; font-size:${theme.textFontSize || 12}px;">${formData.description}</p>${warningHTML}${settings.collectEmail === 'input' || settings.defaultRequired ? '<div class="required-notice glass-panel" style="margin-top:20px;">⚠️ Tanda <span class="asterisk">*</span> menunjukkan area wajib isi</div>' : ''}${draftInfoHTML}</div>`;

            const collectEmail = settings.collectEmail || 'none';
            const isQuizManual = settings.isQuiz && settings.quizRelease === 'manual';
            const requireEmail = collectEmail === 'input' || collectEmail === 'verified' || isQuizManual;

            if (requireEmail) {
                html += `<div class="form-question-card glass-card neumorph-outer email-req-card"><div class="question-title" style="font-size:${theme.questionFontSize || 14}px; margin-bottom:10px !important; padding-bottom:5px; border:none;">Identitas Digital (Email) <span class="asterisk">*</span></div><div style="font-size:0.85rem; color:var(--form-text-muted); margin-bottom:15px;">Alamat email wajib diisi untuk keamanan data ${settings.sendCopy !== 'none' ? 'dan pengiriman salinan' : ''}.</div><input type="email" class="gf-input inner-neumorph" name="respondent_email" placeholder="Ketik alamat email Anda..." required style="font-size:${theme.textFontSize || 12}px;"></div>`;
            }

            let renderSections = JSON.parse(JSON.stringify(formData.sections));
            if (settings.shuffleQuestions) {
                renderSections.forEach(sec => {
                    for (let i = sec.questions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [sec.questions[i], sec.questions[j]] = [sec.questions[j], sec.questions[i]];
                    }
                });
            }

            renderSections.forEach((sec, sIdx) => {
                if(sIdx > 0) {
                    html += `</div><div class="form-step" id="step-${sIdx}"><div class="section-divider-wrapper public-view"><div class="form-section-header glow-effect">Segmen ${sIdx+1} / ${renderSections.length}</div><div class="form-header-card glass-card neumorph-outer rounded-top-none"><h2 class="form-title" style="font-size:1.8rem; margin-bottom:10px;">${sec.title}</h2>${sec.description ? `<p class="form-desc" style="white-space: pre-line; font-size:${theme.textFontSize}px;">${sec.description}</p>` : ''}</div></div>`;
                } else if (sec.title || sec.description) {
                    html += `<div class="section-divider-wrapper public-view"><div class="form-header-card glass-card neumorph-outer"><h2 class="form-title" style="font-size:1.8rem; margin-bottom:10px;">${sec.title}</h2>${sec.description ? `<p class="form-desc" style="white-space: pre-line; font-size:${theme.textFontSize}px;">${sec.description}</p>` : ''}</div></div>`;
                }

                sec.questions.forEach(q => {
                    if(q.type === 'title_only') {
                         html += `<div class="form-question-card title-only-card"><h3 class="question-title gradient-text" style="font-size:1.8rem; margin-bottom:8px; border-bottom: 2px dashed rgba(255,255,255,0.3); padding-bottom:15px;">${q.title}</h3>${q.image ? `<p class="form-desc" style="font-size:${theme.textFontSize}px; margin-top:10px; white-space:pre-line;">${q.image}</p>` : ''}</div>`; return;
                    }

                    let isReq = q.required || settings.defaultRequired;
                    let reqHtml = isReq ? '<span class="asterisk" title="Wajib Diisi">*</span>' : '';
                    let nameAttr = `name="${q.id}"`;
                    let textSize = `font-size:${theme.textFontSize || 12}px;`;

                    let pointsHTML = '';
                    if (settings.isQuiz && settings.quizShowPoints !== false) {
                        let pts = q.points !== undefined ? q.points : (settings.quizDefaultPoints || 0);
                        if (pts > 0) pointsHTML = `<span style="float:right; font-size:0.85rem; background:rgba(139, 92, 246, 0.15); color:var(--form-active-border); padding:4px 10px; border-radius:12px; font-weight:700; display:inline-flex; align-items:center; gap:5px;">⭐ ${pts} Poin</span>`;
                    }

                    let inputHtml = '';
                    // 1. Tipe Reguler
                    if (q.type === 'jawaban_singkat') { inputHtml = `<input type="text" class="gf-input inner-neumorph" ${nameAttr} placeholder="Ketik jawaban singkat..." style="${textSize}" ${isReq?'required':''}>`; } 
                    else if (q.type === 'paragraf') { inputHtml = `<textarea class="gf-input inner-neumorph" ${nameAttr} rows="3" placeholder="Ketik penjelasan mendetail..." oninput="this.style.height=''; this.style.height=this.scrollHeight+'px'" style="resize:none; overflow:hidden; ${textSize}" ${isReq?'required':''}></textarea>`; }
                    else if (q.type === 'pilihan_ganda') { inputHtml = `<div class="gf-radio-group" style="display:flex; flex-direction:column; gap:16px;">`; q.options.forEach(opt => { inputHtml += `<label class="gf-option-label glass-panel" style="${textSize}"><input type="radio" class="gf-radio custom-radio" ${nameAttr} value="${opt}" ${isReq?'required':''}> <span class="opt-text">${opt}</span></label>`; }); inputHtml += `</div>`; }
                    else if (q.type === 'kotak_centang') { inputHtml = `<div class="gf-checkbox-group" style="display:flex; flex-direction:column; gap:16px;">`; q.options.forEach(opt => { inputHtml += `<label class="gf-option-label glass-panel" style="${textSize}"><input type="checkbox" class="gf-checkbox custom-check" ${nameAttr} value="${opt}"> <span class="opt-text">${opt}</span></label>`; }); inputHtml += `</div>`; }
                    else if (q.type === 'dropdown') { inputHtml = `<select class="gf-input inner-neumorph" style="padding:15px; border-radius:12px; ${textSize}" ${nameAttr} ${isReq?'required':''}><option value="" disabled selected>-- Buka Pilihan --</option>`; q.options.forEach(opt => { inputHtml += `<option value="${opt}">${opt}</option>`; }); inputHtml += `</select>`; }
                    else if (q.type === 'tanggal') { inputHtml = `<input type="date" class="gf-input inner-neumorph date-custom" style="width:100%; max-width:250px; ${textSize}" ${nameAttr} ${isReq?'required':''}>`; }
                    else if (q.type === 'waktu') { inputHtml = `<input type="time" class="gf-input inner-neumorph time-custom" style="width:100%; max-width:180px; ${textSize}" ${nameAttr} ${isReq?'required':''}>`; }
                    
                    // 2. SUPER UPGRADE TIPE: UPLOAD FILE (GBR 1)
                    else if (q.type === 'upload_file') {
                        inputHtml = `<div class="inner-neumorph" style="padding:30px 20px; text-align:center; border-radius:12px; border:2px dashed var(--form-active-border) !important; background:rgba(139, 92, 246, 0.05); position:relative;">
                            <div style="font-size:2rem; margin-bottom:10px;">☁️</div><div style="font-weight:600; color:var(--form-text); font-size:1.1rem; margin-bottom:5px;">Tambahkan File</div>
                            <div style="font-size:0.85rem; color:var(--form-text-muted); margin-bottom:15px;">Maksimal ${q.maxFiles || 1} file, max ${q.maxSize || '10 MB'}</div>
                            <button type="button" class="gf-btn-clear neumorph-btn" onclick="this.nextElementSibling.click()">Pilih File</button>
                            <input type="file" class="gf-input file-upload-custom" style="display:none;" ${nameAttr} ${isReq?'required':''} ${q.maxFiles > 1 ? 'multiple' : ''}>
                            <div class="file-names-display" style="margin-top:15px; font-size:0.85rem; color:var(--form-active-border); font-weight:600;"></div>
                        </div>`;
                    }
                    
                    // 3. SUPER UPGRADE TIPE: SKALA LINIER (GBR 3)
                    else if (q.type === 'skala_linier') {
                        const min = q.scaleMin || 1, max = q.scaleMax || 5;
                        inputHtml = `<div class="gf-scale-wrapper inner-neumorph" style="overflow-x:auto; padding: 25px 20px; display:flex; align-items:flex-end; justify-content:center; gap:30px; border-radius:12px;">`;
                        if (q.labelMin) inputHtml += `<span style="font-size:0.9rem; font-weight:600; color:var(--form-text); padding-bottom:5px; text-align:center; max-width:80px; word-wrap:break-word;">${q.labelMin}</span>`;
                        for(let i=min; i<=max; i++) {
                            inputHtml += `<label class="gf-scale-item" style="display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer;"><span class="gf-scale-label" style="font-weight:600; color:var(--form-text-muted);">${i}</span><input type="radio" class="gf-radio custom-radio" name="${q.id}" value="${i}" ${isReq?'required':''}></label>`;
                        }
                        if (q.labelMax) inputHtml += `<span style="font-size:0.9rem; font-weight:600; color:var(--form-text); padding-bottom:5px; text-align:center; max-width:80px; word-wrap:break-word;">${q.labelMax}</span>`;
                        inputHtml += `</div>`;
                    }
                    
                    // 4. SUPER UPGRADE TIPE: RATING (GBR 5)
                    else if (q.type === 'rating') {
                        const levels = q.ratingLevels || 5;
                        inputHtml = `<div class="star-rating-wrapper" style="display:flex; justify-content:center; flex-wrap:wrap; gap:15px;">`;
                        for(let i=1; i<=levels; i++) {
                            inputHtml += `<label class="star-label" style="cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px;">
                                <input type="radio" class="gf-radio custom-radio" style="display:none;" name="${q.id}" value="${i}" ${isReq?'required':''}>
                                <svg class="star-icon" viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2" fill="none" style="color:var(--form-text-muted);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                <span style="font-size:0.85rem; font-weight:600; color:var(--form-text-muted);">${i}</span>
                            </label>`;
                        }
                        inputHtml += `</div>`;
                    }
                    
                    // 5. SUPER UPGRADE TIPE: KISI PILIHAN GANDA & KOTAK CENTANG (GBR 7 & 9)
                    else if (q.type === 'kisi_pilihan_ganda' || q.type === 'kisi_kotak_centang') {
                        const inputType = q.type === 'kisi_pilihan_ganda' ? 'radio' : 'checkbox';
                        const customClass = q.type === 'kisi_pilihan_ganda' ? 'custom-radio' : 'custom-check';
                        inputHtml = `<div class="grid-table-wrapper inner-neumorph" style="overflow-x:auto; border-radius:12px;">
                            <table class="gf-grid-table" style="width:100%; border-collapse:collapse; min-width:500px;">
                                <thead>
                                    <tr><th style="padding:15px; border-bottom:1px solid var(--form-border);"></th>${(q.columns || []).map(col => `<th style="padding:15px; border-bottom:1px solid var(--form-border); text-align:center; font-weight:600; color:var(--form-text);">${col}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    ${(q.rows || []).map((row, rIdx) => `
                                        <tr style="background:${rIdx % 2 === 0 ? 'transparent' : 'rgba(0,0,0,0.03)'}; border-bottom:1px solid rgba(255,255,255,0.2);">
                                            <td style="padding:15px; font-weight:600; color:var(--form-text);">${row}</td>
                                            ${(q.columns || []).map(col => `<td style="padding:15px; text-align:center;"><input type="${inputType}" name="${q.id}_row_${rIdx}" value="${col}" class="${customClass}" ${isReq?'required':''} style="margin:auto; display:block;"></td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                    }
                    else { inputHtml = `<textarea class="gf-input inner-neumorph" ${nameAttr} rows="4" placeholder="Ketik jawaban..." style="${textSize}" ${isReq?'required':''}></textarea>`; }

                    html += `<div class="form-question-card glass-card neumorph-outer" style="margin-bottom:30px;"><div class="question-title" style="font-size:${theme.questionFontSize || 14}px; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid rgba(139, 92, 246, 0.2);">${q.title} ${reqHtml} ${pointsHTML}</div><div class="input-container-morph" style="margin-top:15px; padding: 5px 0;">${inputHtml}</div></div>`;
                });
            });

            if (settings.sendCopy === 'requested' && requireEmail) {
                html += `<div class="form-question-card glass-card neumorph-outer" style="margin-bottom:30px; padding:25px 35px;"><div class="toggle-switch neumorph-switch"><span style="font-weight:600; color:var(--form-text); flex:1; font-size:${theme.textFontSize}px;">Kirimkan salinan jawaban saya</span><input type="checkbox" id="reqCopyAns" name="request_copy" class="switch-input" value="yes"><label for="reqCopyAns" class="switch-label"></label></div></div>`;
            } else if (settings.sendCopy === 'always') { html += `<input type="hidden" name="request_copy" value="yes">`; }

            html += `</div>`;

            let progressTextHTML = '';
            if (settings.showProgress && renderSections.length > 1) { progressTextHTML = `<div style="font-size:0.95rem; font-weight:600; color:var(--form-text-muted); text-align:center; flex:1; min-width:150px;" id="progressTextIndicator">Halaman 1 dari ${renderSections.length}</div>`; }

            html += `
                <div class="form-footer-actions glass-panel" style="margin-top:30px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;">
                    <div style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
                        <button type="button" class="gf-btn-clear neumorph-btn" id="btnPrev" onclick="changeStep(-1)" style="display:none;">🔙 Sebelumnya</button>
                        ${!settings.disableAutoSave ? `<button type="button" class="gf-btn-clear text-danger" onclick="clearFormDraft()" style="border:none; box-shadow:none; background:transparent; font-size:0.95rem; font-weight:600;">Hapus formulir</button>` : ''}
                    </div>
                    ${progressTextHTML}
                    <div style="display:flex; gap:15px; align-items:center;">
                        <button type="button" class="gf-btn-submit glow-effect btn-lg" id="btnNext" onclick="changeStep(1)" style="${renderSections.length > 1 ? '' : 'display:none;'}">Selanjutnya ➡️</button>
                        <button type="submit" class="gf-btn-submit glow-effect btn-lg" id="btnKirim" style="${renderSections.length > 1 ? 'display:none;' : ''}">🚀 Eksekusi Pengiriman</button>
                    </div>
                </div>
            </form>`;

            wrapper.innerHTML = html;
        }

        function initAutoSave() {
            if (!formData || !formData.settings || formData.settings.disableAutoSave) return;
            const formElement = document.getElementById('submissionForm'); if (!formElement) return;

            const draftKey = `bem_form_draft_${formData.id}`;
            const draft = JSON.parse(localStorage.getItem(draftKey) || '{}');
            
            for (let key in draft) {
                const inputs = formElement.querySelectorAll(`[name="${key}"]`);
                if (!inputs.length) continue;
                if (inputs[0].type === 'radio') { inputs.forEach(r => { if(r.value === draft[key]) { r.checked = true; r.dispatchEvent(new Event('change', {bubbles: true})); } }); } 
                else if (inputs[0].type === 'checkbox') { const values = Array.isArray(draft[key]) ? draft[key] : [draft[key]]; inputs.forEach(c => { if(values.includes(c.value)) c.checked = true; }); } 
                else { inputs[0].value = draft[key]; }
            }

            formElement.addEventListener('input', (e) => {
                const target = e.target; if (!target.name) return;
                const currentDraft = JSON.parse(localStorage.getItem(draftKey) || '{}');
                if (target.type === 'checkbox') {
                    const checked = Array.from(formElement.querySelectorAll(`[name="${target.name}"]:checked`)).map(c => c.value);
                    currentDraft[target.name] = checked;
                } else { currentDraft[target.name] = target.value; }
                localStorage.setItem(draftKey, JSON.stringify(currentDraft));
            });
        }
        function clearFormDraft() { if(confirm("Hapus semua draf isian?")) { localStorage.removeItem(`bem_form_draft_${formData.id}`); location.reload(); } }

        function changeStep(n) {
            if (n === 1) {
                const currentStepDiv = document.getElementById(`step-${currentStep}`);
                if(currentStepDiv) {
                    const inputs = currentStepDiv.querySelectorAll('input[required], select[required], textarea[required]');
                    for (let el of inputs) { if (!el.checkValidity()) { el.reportValidity(); return; } }
                }
            }

            const oldStepDiv = document.getElementById(`step-${currentStep}`); if(oldStepDiv) oldStepDiv.classList.remove('active');
            const oldStepper = document.getElementById(`stepper-item-${currentStep}`); if (oldStepper) { oldStepper.classList.add('completed'); oldStepper.classList.remove('active'); }

            currentStep += n;

            const newStepDiv = document.getElementById(`step-${currentStep}`); if(newStepDiv) newStepDiv.classList.add('active');
            const newStepper = document.getElementById(`stepper-item-${currentStep}`); if (newStepper) { newStepper.classList.add('active'); newStepper.classList.remove('completed'); }

            document.getElementById('btnPrev').style.display = currentStep > 0 ? 'inline-block' : 'none';
            if (currentStep === formData.sections.length - 1) { document.getElementById('btnNext').style.display = 'none'; document.getElementById('btnKirim').style.display = 'inline-block'; } 
            else { document.getElementById('btnNext').style.display = 'inline-block'; document.getElementById('btnKirim').style.display = 'none'; }
            
            const progInd = document.getElementById('progressTextIndicator'); if (progInd) { progInd.innerText = `Halaman ${currentStep + 1} dari ${formData.sections.length}`; }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('btnKirim');
            btn.innerHTML = '<span class="loader-ring-small"></span> Transmisi Data...'; btn.disabled = true; btn.classList.add('loading-state');

            const formElement = document.getElementById('submissionForm');
            const formDataObj = new FormData(formElement);
            
            let responses = {}; let email = "";

            for (let [key, value] of formDataObj.entries()) {
                if (key === 'respondent_email') { email = value; continue; }
                if (key === 'request_copy') continue;
                if (responses[key]) {
                    if (!Array.isArray(responses[key])) responses[key] = [responses[key]];
                    responses[key].push(value);
                } else { responses[key] = value; }
            }

            const payload = { formId: formData.id, email: email, responses: responses };

            try {
                const res = await fetch('/api/forms/submit', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const json = await res.json();
                if (json.success) {
                    localStorage.removeItem(`bem_form_draft_${formData.id}`);
                    const msg = formData.settings.confirmationMessage || "Jawaban Anda telah dicatat.";
                    const showAnother = formData.settings.showSubmitAnother !== false && !formData.settings.limitOne;
                    const theme = formData.theme || {};
                    
                    document.getElementById('publicFormWrapper').innerHTML = `
                        <div class="form-header-banner success-banner glow-effect" style="background: linear-gradient(135deg, #10b981, #059669);"></div>
                        <div class="form-header-card glass-card neumorph-outer rounded-top-none text-center" style="padding: 60px 30px;">
                            <div class="success-icon glow-effect" style="font-size:4rem; margin-bottom:20px; animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);">✨</div>
                            <h1 class="form-title gradient-text" style="font-size:${theme.headerFontSize || 32}px;">Sistem Menerima Data</h1>
                            <p class="success-desc glass-panel" style="font-size:${theme.textFontSize || 14}px; color:var(--form-text); margin: 30px auto; max-width:80%; border-left: 4px solid #10b981; white-space:pre-line;">${msg}</p>
                            <div style="display:flex; justify-content:center; gap:15px; margin-top:30px; flex-wrap:wrap;">
                                ${showAnother ? `<button onclick="location.reload()" class="gf-btn-clear neumorph-btn" style="font-weight:600; color:var(--form-active-border);">🔄 Submit Respon Baru</button>` : ''}
                                ${formData.settings.showSummary ? `<button onclick="alert('Fitur Ringkasan dalam Pengembangan')" class="gf-btn-clear neumorph-btn" style="font-weight:600; color:#10b981;">📊 Lihat Ringkasan</button>` : ''}
                            </div>
                        </div>`;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else { alert("Akses Tertolak. Gagal mengirim ke server."); btn.innerHTML = '🚀 Eksekusi Pengiriman'; btn.disabled = false; btn.classList.remove('loading-state'); }
            } catch (err) { alert("Kesalahan Jaringan. Database server menolak request transmisi."); btn.innerHTML = '🚀 Eksekusi Pengiriman'; btn.disabled = false; btn.classList.remove('loading-state'); }
        }
    </script>
</body>
</html>
