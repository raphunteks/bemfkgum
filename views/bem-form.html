<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir - BEM KBMFKG UMI</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mainV2.css">
    <style>
        body { background: var(--form-bg); }
    </style>
</head>
<body>
    <!-- HEADER STANDAR BEM -->
    <%- include('partials/header.html') %>

    <main class="form-wrapper" id="publicFormWrapper">
        <div style="text-align:center; padding: 100px 20px;">
            <div class="loader-ring"></div>
            <p style="color:var(--text-muted);">Mempersiapkan Formulir...</p>
        </div>
    </main>

    <!-- FOOTER STANDAR BEM -->
    <%- include('partials/footer.html') %>

    <script>
        // Ambil slug dari URL path e.g., /form/pendaftaran-panitia
        const pathArray = window.location.pathname.split('/');
        const slug = pathArray[pathArray.length - 1];
        let formData = null;

        document.addEventListener('DOMContentLoaded', loadPublicForm);

        async function loadPublicForm() {
            try {
                const res = await fetch(`/api/forms/${slug}`);
                const json = await res.json();
                
                if(!json.success || !json.data) {
                    renderError("Formulir tidak ditemukan atau link salah.");
                    return;
                }
                
                formData = json.data;
                if(!formData.isActive) {
                    renderError("Formulir ini sudah tidak menerima respons.");
                    return;
                }

                renderFormHTML();
            } catch(e) {
                renderError("Terjadi kesalahan jaringan.");
            }
        }

        function renderError(msg) {
            document.getElementById('publicFormWrapper').innerHTML = `
                <div class="form-header-card" style="border-top-color:#d93025; text-align:center; padding: 50px;">
                    <h2 class="form-title" style="color:#d93025;">Peringatan</h2>
                    <p class="form-desc">${msg}</p>
                </div>
            `;
        }

        function renderFormHTML() {
            const wrapper = document.getElementById('publicFormWrapper');
            let html = `
                <form id="submissionForm" onsubmit="submitForm(event)">
                    <div class="form-header-card">
                        <h1 class="form-title">${formData.title}</h1>
                        <p class="form-desc">${formData.description}</p>
                        ${formData.settings.collectEmail === 'input' ? '<div class="required-notice">* Menunjukkan pertanyaan yang wajib diisi</div>' : ''}
                    </div>
            `;

            // Email Collection Check
            if (formData.settings.collectEmail === 'input') {
                html += `
                    <div class="form-question-card">
                        <div class="question-title">Email <span class="asterisk">*</span></div>
                        <input type="email" class="gf-input" name="respondent_email" placeholder="Jawaban Anda" required>
                    </div>
                `;
            }

            formData.sections.forEach((sec, sIdx) => {
                // Section Title (Jika ada bagian lebih dari 1)
                if(formData.sections.length > 1 && sec.title) {
                    html += `
                    <div class="form-header-card" style="border-top: 10px solid #607d8b; border-radius:0; margin-top:20px;">
                        <h2 class="form-title" style="font-size:1.5rem;">${sec.title}</h2>
                        <p class="form-desc">${sec.description}</p>
                    </div>`;
                }

                sec.questions.forEach(q => {
                    // Judul Only Type
                    if(q.type === 'title_only') {
                         html += `
                         <div class="form-question-card" style="border-left:none;">
                            <h3 style="font-size:1.2rem; color:var(--form-text); margin-bottom:5px;">${q.title}</h3>
                         </div>`;
                         return;
                    }

                    let reqHtml = q.required ? '<span class="asterisk">*</span>' : '';
                    let inputHtml = '';
                    let nameAttr = `name="${q.id}"`;

                    if (q.type === 'jawaban_singkat') {
                        inputHtml = `<input type="text" class="gf-input" ${nameAttr} placeholder="Jawaban Anda" ${q.required?'required':''}>`;
                    } 
                    else if (q.type === 'paragraf') {
                        inputHtml = `<textarea class="gf-input" ${nameAttr} rows="1" placeholder="Jawaban Anda" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" style="resize:none; overflow:hidden;" ${q.required?'required':''}></textarea>`;
                    }
                    else if (q.type === 'pilihan_ganda') {
                        inputHtml = `<div class="gf-radio-group">`;
                        q.options.forEach(opt => {
                            inputHtml += `<label class="gf-option-label"><input type="radio" class="gf-radio" ${nameAttr} value="${opt}" ${q.required?'required':''}> ${opt}</label>`;
                        });
                        inputHtml += `</div>`;
                    }
                    else if (q.type === 'kotak_centang') {
                        inputHtml = `<div class="gf-checkbox-group">`;
                        q.options.forEach(opt => {
                            // Checkbox tak bisa 'required' biasa di HTML5 array, butuh custom validation, kita omit native required
                            inputHtml += `<label class="gf-option-label"><input type="checkbox" class="gf-checkbox" ${nameAttr} value="${opt}"> ${opt}</label>`;
                        });
                        inputHtml += `</div>`;
                    }
                    else if (q.type === 'dropdown') {
                        inputHtml = `<select class="q-type-select gf-input" ${nameAttr} ${q.required?'required':''}>
                                        <option value="" disabled selected>Pilih</option>`;
                        q.options.forEach(opt => { inputHtml += `<option value="${opt}">${opt}</option>`; });
                        inputHtml += `</select>`;
                    }
                    else if (q.type === 'upload_file') {
                        inputHtml = `<input type="file" class="gf-input" style="border:none;" ${nameAttr} ${q.required?'required':''}>`;
                    }
                    else if (q.type === 'tanggal') {
                        inputHtml = `<input type="date" class="gf-input" style="width:auto;" ${nameAttr} ${q.required?'required':''}>`;
                    }
                    else if (q.type === 'waktu') {
                        inputHtml = `<input type="time" class="gf-input" style="width:auto;" ${nameAttr} ${q.required?'required':''}>`;
                    }
                    else if (q.type === 'skala_linier') {
                        inputHtml = `<div class="gf-scale-wrapper">`;
                        for(let i=1; i<=5; i++){
                             inputHtml += `<label class="gf-scale-item"><span class="gf-scale-label">${i}</span><input type="radio" class="gf-radio" ${nameAttr} value="${i}" ${q.required?'required':''}></label>`;
                        }
                        inputHtml += `</div>`;
                    }
                    else {
                        // Fallback
                        inputHtml = `<textarea class="gf-input" ${nameAttr} rows="2" placeholder="Jawaban Anda" ${q.required?'required':''}></textarea>`;
                    }

                    let imgHtml = q.image ? `<img src="${q.image}" style="max-width:100%; border-radius:8px; margin-bottom:15px; display:block;">` : '';

                    html += `
                    <div class="form-question-card">
                        <div class="question-title">${q.title} ${reqHtml}</div>
                        ${imgHtml}
                        ${inputHtml}
                    </div>
                    `;
                });
            });

            html += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                    <button type="submit" class="gf-btn-submit" id="btnKirim">Kirim</button>
                    <button type="button" class="gf-btn-clear" onclick="document.getElementById('submissionForm').reset()">Kosongkan formulir</button>
                </div>
                </form>
            `;

            wrapper.innerHTML = html;
        }

        async function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('btnKirim');
            btn.innerText = 'Mengirim...'; btn.disabled = true;

            const formElement = document.getElementById('submissionForm');
            const formDataObj = new FormData(formElement);
            
            let responses = {};
            let email = "";

            for (let [key, value] of formDataObj.entries()) {
                if (key === 'respondent_email') { email = value; continue; }
                
                // Handle multiple checkboxes array
                if (responses[key]) {
                    if (!Array.isArray(responses[key])) responses[key] = [responses[key]];
                    responses[key].push(value);
                } else {
                    responses[key] = value;
                }
            }

            const payload = {
                formId: formData.id,
                email: email,
                responses: responses
            };

            try {
                const res = await fetch('/api/forms/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                
                if (json.success) {
                    const msg = formData.settings.confirmationMessage || "Jawaban Anda telah dicatat.";
                    document.getElementById('publicFormWrapper').innerHTML = `
                        <div class="form-header-card" style="text-align:center; padding: 60px 30px;">
                            <h1 class="form-title">${formData.title}</h1>
                            <p style="font-size:1.2rem; margin: 20px 0;">✅ ${msg}</p>
                            <a href="#" onclick="location.reload()" style="color:var(--form-active-border); font-weight:bold; text-decoration:none;">Kirim jawaban lain</a>
                        </div>
                    `;
                } else {
                    alert("Gagal mengirim jawaban. Coba lagi.");
                }
            } catch (err) {
                alert("Kesalahan jaringan.");
            }
            
            btn.innerText = 'Kirim'; btn.disabled = false;
        }
    </script>
</body>
</html>
