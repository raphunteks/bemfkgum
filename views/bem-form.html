<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kegiatan - BEM KBMFKG UMI</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <!-- DYNAMIC FONTS (AKAN DI LOAD OLEH JS) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@500&family=Oswald:wght@500&family=Lora:wght@500&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    
    <!-- MENGGUNAKAN DUA FILE CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mainV2.css">
    
    <!-- PROTECT DEVTOOLS -->
    <script src="/js/protect-devtools.js"></script>

    <style>
        /* TEMA DINAMIS AKAN MENG-OVERRIDE CLASS INI */
        body { background: var(--form-bg); font-family: var(--form-font-text); display: block; }
        .form-title { font-family: var(--form-font-header) !important; }
        .question-title { font-family: var(--form-font-question) !important; }
        
        .form-header-banner {
            width: 100%; height: 140px; background-color: var(--form-active-border);
            border-radius: 12px 12px 0 0; border: 1px solid var(--form-border); border-bottom: none;
            position: relative; overflow: hidden;
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body>
    <!-- HEADER STANDAR BEM -->
    <%- include('partials/header.html') %>

    <main class="form-wrapper" id="publicFormWrapper">
        <div style="text-align:center; padding: 150px 20px;">
            <div class="loader-ring"></div>
            <p style="color:var(--form-text-muted); font-size:1.15rem; font-weight:700; margin-top:20px;">Mempersiapkan Formulir Pendaftaran...</p>
        </div>
    </main>

    <!-- FOOTER STANDAR BEM -->
    <%- include('partials/footer.html') %>

    <script>
        const pathArray = window.location.pathname.split('/');
        const slug = pathArray[pathArray.length - 1];
        let formData = null;

        document.addEventListener('DOMContentLoaded', loadPublicForm);

        async function loadPublicForm() {
            try {
                const res = await fetch(`/api/forms/${slug}`);
                const json = await res.json();
                
                if(!json.success || !json.data) { return renderError("Oops! Formulir tidak ditemukan atau URL link Anda tidak valid."); }
                
                formData = json.data;
                
                // Set Theme from JSON
                if(formData.theme) {
                    const t = formData.theme;
                    document.documentElement.style.setProperty('--form-active-border', t.color);
                    document.documentElement.style.setProperty('--form-bg', t.bgColor);
                    document.documentElement.style.setProperty('--form-font-header', `"${t.headerFont}", sans-serif`);
                    document.documentElement.style.setProperty('--form-font-question', `"${t.questionFont}", sans-serif`);
                    document.documentElement.style.setProperty('--form-font-text', `"${t.textFont}", sans-serif`);
                }
                
                // Validasi Status Aktif
                if(formData.isActive === false) { return renderError("Formulir ini sudah ditutup secara manual dan tidak menerima tanggapan lagi."); }

                // Validasi Deadline Kalender
                if(formData.settings && formData.settings.deadline) {
                    const now = new Date();
                    const deadlineDate = new Date(formData.settings.deadline);
                    if(now > deadlineDate) {
                        const dateStr = deadlineDate.toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                        return renderError(`Waktu pengisian formulir ini telah berakhir pada <strong style="color:var(--form-text); display:block; margin-top:10px;">${dateStr} WITA</strong>`);
                    }
                }

                renderFormHTML();
            } catch(e) {
                renderError("Terjadi kesalahan jaringan server saat memuat form.");
            }
        }

        function renderError(msg) {
            document.getElementById('publicFormWrapper').innerHTML = `
                <div class="form-header-card" style="border-top:10px solid #ef4444; text-align:center; padding: 60px 30px;">
                    <div style="font-size: 3.5rem; margin-bottom: 20px;">🚫</div>
                    <h2 class="form-title" style="color:#ef4444; font-size:1.8rem; font-weight:800; margin-bottom:15px;">Akses Ditolak</h2>
                    <p class="form-desc" style="font-size:1.1rem; color:var(--form-text);">${msg}</p>
                    <button class="gf-btn-clear" style="margin-top:30px; font-size:1rem; color:#ef4444; background:rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2);" onclick="window.location.href='/'">Kembali ke Beranda</button>
                </div>
            `;
        }

        function renderFormHTML() {
            const wrapper = document.getElementById('publicFormWrapper');
            const theme = formData.theme || {};
            
            // Header Image Style
            let headerImgStyle = theme.headerImage ? `background-image: url('${theme.headerImage}');` : '';

            // Deadline Warning UI
            let warningHTML = '';
            if(formData.settings.deadline) {
                const dl = new Date(formData.settings.deadline);
                const strDl = dl.toLocaleString('id-ID', {day: 'numeric', month: 'short', hour:'2-digit', minute:'2-digit'});
                warningHTML = `<div style="background:rgba(234, 179, 8, 0.1); color:#ca8a04; padding:10px 15px; border-radius:8px; margin-top:20px; font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:8px;">⏳ Ditutup otomatis: ${strDl} WITA</div>`;
            }

            let html = `
                <form id="submissionForm" onsubmit="submitForm(event)">
                    <div class="form-header-banner" style="${headerImgStyle}"></div>
                    <div class="form-header-card" style="border-top:none; border-radius: 0 0 12px 12px; margin-top:-1px;">
                        <h1 class="form-title" style="font-size:${theme.headerFontSize || 24}px;">${formData.title}</h1>
                        <p class="form-desc" style="white-space: pre-line; font-size:${theme.textFontSize || 11}px;">${formData.description}</p>
                        ${warningHTML}
                        ${formData.settings.collectEmail === 'input' ? '<div class="required-notice">* Menunjukkan pertanyaan yang wajib diisi</div>' : ''}
                    </div>
            `;

            if (formData.settings.collectEmail === 'input') {
                html += `
                    <div class="form-question-card">
                        <div class="question-title" style="font-size:${theme.questionFontSize || 12}px;">Alamat Email <span class="asterisk">*</span></div>
                        <input type="email" class="gf-input" name="respondent_email" placeholder="Jawaban Anda" required style="font-size:${theme.textFontSize || 11}px;">
                    </div>
                `;
            }

            formData.sections.forEach((sec, sIdx) => {
                // Multi-section Separator
                if(formData.sections.length > 1) {
                    html += `
                    <div style="margin-top:30px; position:relative;">
                        <div class="form-section-header">Bagian ${sIdx+1} dari ${formData.sections.length}</div>
                        <div class="form-header-card" style="border-top: none; border-radius: 0 12px 12px 12px; margin-top:0;">
                            <h2 class="form-title" style="font-size:1.6rem; margin-bottom:5px;">${sec.title}</h2>
                            ${sec.description ? `<p class="form-desc" style="white-space: pre-line; font-size:${theme.textFontSize}px;">${sec.description}</p>` : ''}
                        </div>
                    </div>`;
                }

                sec.questions.forEach(q => {
                    if(q.type === 'title_only') {
                         html += `
                         <div class="form-question-card" style="border-left:none; box-shadow:none; background:transparent; padding-bottom:10px;">
                            <h3 style="font-size:1.4rem; color:var(--form-text); margin-bottom:5px; border-bottom: 1px solid var(--form-border); padding-bottom:10px;">${q.title}</h3>
                            ${q.image ? `<p style="font-size:${theme.textFontSize}px; color:var(--form-text-muted); margin-top:5px;">${q.image}</p>` : ''}
                         </div>`;
                         return;
                    }

                    let reqHtml = q.required ? '<span class="asterisk">*</span>' : '';
                    let inputHtml = '';
                    let nameAttr = `name="${q.id}"`;
                    let textSize = `font-size:${theme.textFontSize || 11}px;`;

                    if (q.type === 'jawaban_singkat') { inputHtml = `<input type="text" class="gf-input" ${nameAttr} placeholder="Jawaban Anda" style="${textSize}" ${q.required?'required':''}>`; } 
                    else if (q.type === 'paragraf') { inputHtml = `<textarea class="gf-input" ${nameAttr} rows="3" placeholder="Jawaban Anda" oninput="this.style.height=''; this.style.height=this.scrollHeight+'px'" style="resize:none; overflow:hidden; ${textSize}" ${q.required?'required':''}></textarea>`; }
                    else if (q.type === 'pilihan_ganda') {
                        inputHtml = `<div class="gf-radio-group">`;
                        q.options.forEach(opt => { inputHtml += `<label class="gf-option-label" style="${textSize}"><input type="radio" class="gf-radio" ${nameAttr} value="${opt}" ${q.required?'required':''}> ${opt}</label>`; });
                        inputHtml += `</div>`;
                    }
                    else if (q.type === 'kotak_centang') {
                        inputHtml = `<div class="gf-checkbox-group">`;
                        q.options.forEach(opt => { inputHtml += `<label class="gf-option-label" style="${textSize}"><input type="checkbox" class="gf-checkbox" ${nameAttr} value="${opt}"> ${opt}</label>`; });
                        inputHtml += `</div>`;
                    }
                    else if (q.type === 'dropdown') {
                        inputHtml = `<select class="gf-input" style="padding:10px; border-radius:6px; background:var(--form-bg); border:1px solid var(--form-border); ${textSize}" ${nameAttr} ${q.required?'required':''}>
                                        <option value="" disabled selected>Pilih salah satu</option>`;
                        q.options.forEach(opt => { inputHtml += `<option value="${opt}">${opt}</option>`; });
                        inputHtml += `</select>`;
                    }
                    else if (q.type === 'upload_file') {
                        inputHtml = `<input type="file" class="gf-input" style="border:none; background:var(--form-bg); padding:15px; border-radius:8px; ${textSize}" ${nameAttr} ${q.required?'required':''}>`;
                    }
                    else if (q.type === 'tanggal') {
                        inputHtml = `<input type="date" class="gf-input" style="width:200px; font-family:inherit; background:var(--form-bg); padding:10px; border-radius:6px; border:1px solid var(--form-border); ${textSize}" ${nameAttr} ${q.required?'required':''}>`;
                    }
                    else if (q.type === 'waktu') {
                        inputHtml = `<input type="time" class="gf-input" style="width:150px; font-family:inherit; background:var(--form-bg); padding:10px; border-radius:6px; border:1px solid var(--form-border); ${textSize}" ${nameAttr} ${q.required?'required':''}>`;
                    }
                    else if (q.type === 'skala_linier' || q.type === 'rating') {
                        inputHtml = `<div class="gf-scale-wrapper" style="overflow-x:auto;">`;
                        for(let i=1; i<=5; i++){
                             inputHtml += `<label class="gf-scale-item"><span class="gf-scale-label" style="${textSize}">${i}</span><input type="radio" class="gf-radio" ${nameAttr} value="${i}" ${q.required?'required':''}></label>`;
                        }
                        inputHtml += `</div>`;
                    }
                    else { inputHtml = `<textarea class="gf-input" ${nameAttr} rows="4" placeholder="Jawaban Anda" style="${textSize}" ${q.required?'required':''}></textarea>`; }

                    html += `
                    <div class="form-question-card">
                        <div class="question-title" style="font-size:${theme.questionFontSize || 12}px;">${q.title} ${reqHtml}</div>
                        ${inputHtml}
                    </div>
                    `;
                });
            });

            html += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                    <button type="submit" class="gf-btn-submit" id="btnKirim">Kirim</button>
                    <button type="button" class="gf-btn-clear" onclick="if(confirm('Kosongkan semua jawaban?')) document.getElementById('submissionForm').reset()">Kosongkan formulir</button>
                </div>
                </form>
            `;

            wrapper.innerHTML = html;
        }

        // ================= TRANSAKSI MENGIRIM JAWABAN =================
        async function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('btnKirim');
            btn.innerText = 'Mengirim...'; btn.disabled = true;

            const formElement = document.getElementById('submissionForm');
            const formDataObj = new FormData(formElement);
            
            let responses = {};
            let email = "";

            for (let [key, value] of formDataObj.entries()) {
                if (key === 'respondent_email') { email = value; continue; }
                if (responses[key]) {
                    if (!Array.isArray(responses[key])) responses[key] = [responses[key]];
                    responses[key].push(value);
                } else {
                    responses[key] = value;
                }
            }

            const payload = {
                formId: formData.id,
                email: email,
                responses: responses
            };

            try {
                const res = await fetch('/api/forms/submit', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                
                if (json.success) {
                    const msg = formData.settings.confirmationMessage || "Jawaban Anda telah dicatat.";
                    const theme = formData.theme || {};
                    
                    document.getElementById('publicFormWrapper').innerHTML = `
                        <div class="form-header-banner"></div>
                        <div class="form-header-card" style="border-top:none; border-radius: 0 0 12px 12px; margin-top:-1px;">
                            <h1 class="form-title" style="font-size:${theme.headerFontSize || 24}px;">${formData.title}</h1>
                            <p style="font-size:${theme.textFontSize || 11}px; color:var(--form-text); margin: 20px 0;">${msg}</p>
                            
                            ${formData.settings.editResponse ? `<p style="margin-bottom:10px;"><a href="#" style="color:var(--form-active-border); font-size:${theme.textFontSize || 11}px;">Edit tanggapan Anda</a></p>` : ''}
                            ${!formData.settings.limitOne ? `<a href="#" onclick="location.reload()" style="color:var(--form-active-border); font-size:${theme.textFontSize || 11}px;">Kirim jawaban lain</a>` : ''}
                        </div>
                    `;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else { alert("Gagal mengirim jawaban."); }
            } catch (err) { alert("Kesalahan Jaringan. Database server tidak merespon."); }
            
            btn.innerText = 'Kirim'; btn.disabled = false;
        }
    </script>
</body>
</html>
