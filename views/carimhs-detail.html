<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Data | PDDIKTI BEM</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/mainV5.css">
</head>
<body class="neo-bg-bg" style="display: flex; justify-content: center; padding: 50px 20px;">

    <div class="neo-card neo-bg-white" id="detail-container" style="max-width: 750px; width: 100%; position: relative; padding: 50px;">
        <a href="/carimhs" class="neo-btn neo-bg-yellow" style="position: absolute; top: -20px; left: 20px; text-decoration:none; padding: 12px 25px; font-size: 1rem;">⬅ KEMBALI</a>
        
        <!-- HEADER PROFIL (FOTO, NAMA, ID) -->
        <div style="text-align: center; margin-top: 20px; margin-bottom: 40px;">
            <img id="d-foto" src="/img/bemprofilmhs.png" style="width: 140px; height: 140px; border-radius: 50%; border: 5px solid #000; box-shadow: 5px 5px 0px #000; background: var(--bg-blue); margin: 0 auto 20px; display:block; object-fit: cover;">
            <h1 class="neo-heading" id="d-nama" style="font-size: 2.2rem; line-height:1.2;">Memuat...</h1>
            <h2 class="neo-heading-sm" id="d-nim" style="color: var(--text-muted); font-family: 'Space Mono', monospace; font-size: 1.5rem; margin-top:10px;">-</h2>
            <div id="d-badge-tipe" style="margin-top: 15px; display: none;"></div>
        </div>

        <!-- TABEL BIODATA UTAMA -->
        <table class="neo-table" style="width: 100%; border: 4px solid #000;">
            <tbody id="dynamic-tbody">
                <tr><td class="text-center" style="font-weight: 700;">Menarik data dari database...</td></tr>
            </tbody>
        </table>
        
        <!-- KONTOTAINER KHUSUS RIWAYAT DOSEN -->
        <div id="riwayat-container"></div>

        <div style="text-align: center; margin-top: 40px; border-top: 4px dashed #000; padding-top: 20px;">
            <p style="font-weight: 800; font-size: 1rem; color: #1e1e1e;">Sumber Data: Database Resmi Institusi KBMFKG UMI</p>
        </div>
    </div>

<script>
    // Skema Default Fallback
    const DEFAULT_SCHEMA_MHS = [
        { id: 'foto', label: 'Foto Profil', type: 'image' },
        { id: 'nim', label: 'NIM (Nomor Induk)', type: 'text' },
        { id: 'nama', label: 'Nama Lengkap', type: 'text' },
        { id: 'angkatan', label: 'Tahun Angkatan', type: 'number' },
        { id: 'prodi', label: 'Program Studi', type: 'select' },
        { id: 'status', label: 'Status Akademik', type: 'select' }
    ];

    const DEFAULT_SCHEMA_DOSEN = [
        { id: 'foto', label: 'Foto Profil', type: 'image' },
        { id: 'nip', label: 'NIDN / NIP', type: 'text' },
        { id: 'nama', label: 'Nama Lengkap', type: 'text' },
        { id: 'gelar', label: 'Gelar', type: 'text' },
        { id: 'prodi', label: 'Program Studi / Unit Kerja', type: 'select' },
        { id: 'jabatan', label: 'Jabatan Fungsional', type: 'select' },
        { id: 'ikatan', label: 'Status Ikatan Kerja', type: 'select' },
        { id: 'pendidikan', label: 'Pendidikan (Jenjang Terakhir)', type: 'select' },
        { id: 'riwayat_pendidikan', label: 'Riwayat Pendidikan', type: 'riwayat' },
        { id: 'status', label: 'Status Aktif', type: 'select' }
    ];

    const DEFAULT_SCHEMA_CIVITAS = [
        { id: 'foto', label: 'Foto Profil', type: 'image' },
        { id: 'nip', label: 'NIP', type: 'text' },
        { id: 'nama', label: 'Nama Lengkap', type: 'text' },
        { id: 'jk', label: 'Jenis Kelamin', type: 'select' },
        { id: 'prodi', label: 'Program Studi / Unit Kerja', type: 'text' },
        { id: 'jabatan', label: 'Jabatan Fungsional', type: 'text' },
        { id: 'ikatan', label: 'Status Ikatan Kerja', type: 'text' },
        { id: 'pendidikan', label: 'Pendidikan Terakhir', type: 'select' },
        { id: 'gelar', label: 'Gelar Akademik', type: 'text' },
        { id: 'tahun_lulus', label: 'Tahun', type: 'number' },
        { id: 'status', label: 'Status', type: 'select' }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        // Bisa menangkap nim, nidn, ataupun nip
        const idParam = urlParams.get('nim') || urlParams.get('nidn') || urlParams.get('nip'); 
        const typeParam = urlParams.get('type') || 'mhs'; 

        if(!idParam) {
            document.getElementById('d-nama').innerText = "Data Tidak Valid";
            document.getElementById('dynamic-tbody').innerHTML = `<tr><td class="text-center neo-bg-pink" style="font-weight: 700;">Parameter URL ID (NIM/NIP/NIDN) tidak ditemukan.</td></tr>`;
            return;
        }

        try {
            // 1. Fetch Data Utama Terlebih Dahulu 
            let dataUrl = '';
            if (typeParam === 'mhs') {
                dataUrl = `/api/mhs/${idParam}`;
            } else {
                dataUrl = `/api/civitas/${idParam}`;
            }
            
            if(window.location.origin === "null") dataUrl = `https://bemkbmfkgumi.com${dataUrl}`;

            const resData = await fetch(dataUrl);
            const jsonData = await resData.json();

            if(jsonData.success && jsonData.data) {
                const d = jsonData.data;
                
                // 2. Tentukan Skema Berdasarkan Tipe
                let schemaUrl = '';
                let defaultSchema = DEFAULT_SCHEMA_MHS;
                
                if (typeParam === 'mhs') {
                    schemaUrl = `/api/mhs/schema`;
                } else {
                    let tp = d.tipe_pegawai || typeParam; 
                    schemaUrl = `/api/civitas/schema/${tp}`;
                    defaultSchema = tp === 'dosen' ? DEFAULT_SCHEMA_DOSEN : DEFAULT_SCHEMA_CIVITAS;
                    
                    const badgeEl = document.getElementById('d-badge-tipe');
                    badgeEl.style.display = 'block';
                    badgeEl.innerHTML = tp === 'dosen' 
                        ? `<span class="neo-badge neo-bg-blue" style="font-size:1rem;">Dosen Pengajar</span>`
                        : `<span class="neo-badge neo-bg-yellow" style="font-size:1rem;">Staf Civitas</span>`;
                }

                if(window.location.origin === "null") schemaUrl = `https://bemkbmfkgumi.com${schemaUrl}`;
                
                // 3. Fetch Skema 
                let schema = null;
                try {
                    const resSchema = await fetch(schemaUrl);
                    const jsonSchema = await resSchema.json();
                    if(jsonSchema.success && jsonSchema.data && jsonSchema.data.length > 0) {
                        schema = jsonSchema.data;
                    }
                } catch(err) {
                    console.log("Menggunakan skema default fallback.");
                }

                schema = schema || defaultSchema;

                // 4. Render Data
                let fotoUrl = '/img/bemprofilmhs.png';
                let namaVal = '-';
                let identitasVal = idParam;
                let tableHtml = '';
                let riwayatHtml = '';

                schema.forEach(field => {
                    let val = d[field.id] || '-';
                    let fId = field.id.toLowerCase();
                    let fLabel = field.label.toLowerCase();

                    // SKIP: Foto, Nama, NIP/NIDN/NIM
                    if (field.type === 'image') {
                        if(val !== '-') fotoUrl = val;
                        return; 
                    }
                    if (fId.includes('nama') || fLabel.includes('nama')) {
                        if(val !== '-') namaVal = val;
                        return; 
                    }
                    if (fId === 'nim' || fId === 'nip' || fId === 'nidn' || fLabel.includes('nim') || fLabel.includes('nip') || fLabel.includes('nidn')) {
                        if(val !== '-') identitasVal = val;
                        return; 
                    }

                    // KHUSUS RENDER SUB-FORM RIWAYAT (TABEL TERPISAH)
                    if (field.type === 'riwayat') {
                        let rwData = [];
                        try { rwData = JSON.parse(val); } catch(e) {}
                        
                        if(rwData && rwData.length > 0) {
                            let rows = '';
                            rwData.forEach(rw => {
                                rows += `
                                <tr>
                                    <td style="padding:15px; border-bottom:2px solid #cbd5e1; font-weight:600;">${rw.pt || '-'}</td>
                                    <td style="padding:15px; border-bottom:2px solid #cbd5e1; font-weight:600;">${rw.gelar_akademik || '-'}</td>
                                    <td style="padding:15px; border-bottom:2px solid #cbd5e1; font-weight:600;">${rw.tahun || '-'}</td>
                                    <td style="padding:15px; border-bottom:2px solid #cbd5e1; font-weight:600;">${rw.jenjang || '-'}</td>
                                </tr>`;
                            });

                            riwayatHtml += `
                            <div style="margin-top: 40px;">
                                <div style="background: linear-gradient(90deg, #d946ef, #8b5cf6); color: white; padding: 18px; text-align: center; border-radius: 12px; margin-bottom: 20px; border: 3px solid #000; box-shadow: 4px 4px 0px #000;">
                                    <h2 style="margin:0; font-family:'Outfit', sans-serif; font-size:1.6rem; letter-spacing:1px;">Riwayat Dosen</h2>
                                </div>
                                
                                <div style="display:flex; justify-content:center; gap:10px; margin-bottom: 15px;">
                                    <div style="background: linear-gradient(90deg, #f472b6, #c084fc); color: white; padding: 10px 30px; border-radius: 8px; font-weight: bold; border: 2px solid #000;">Riwayat Pendidikan</div>
                                    <div style="background: #f1f5f9; color: #94a3b8; padding: 10px 30px; border-radius: 8px; font-weight: bold; border: 2px solid #cbd5e1;">Riwayat Mengajar</div>
                                </div>

                                <div style="overflow-x: auto; border: 4px solid #000; border-radius: 8px; box-shadow: 5px 5px 0px #000;">
                                    <table style="width: 100%; border-collapse: collapse; background: #fff;">
                                        <thead>
                                            <tr style="background: #e9d5ff;">
                                                <th style="padding: 15px; text-align: left; font-weight: 800; border-bottom: 4px solid #000;">Perguruan Tinggi</th>
                                                <th style="padding: 15px; text-align: left; font-weight: 800; border-bottom: 4px solid #000;">Gelar Akademik</th>
                                                <th style="padding: 15px; text-align: left; font-weight: 800; border-bottom: 4px solid #000;">Tahun</th>
                                                <th style="padding: 15px; text-align: left; font-weight: 800; border-bottom: 4px solid #000;">Jenjang</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rows}
                                        </tbody>
                                    </table>
                                </div>
                            </div>`;
                        }
                        return; // Jangan dimasukkan ke dalam tabel biodata utama
                    }

                    // RENDER BARIS TABEL BIODATA UTAMA
                    let displayVal = val;
                    if (fId.includes('status') || fLabel.includes('status')) {
                        let statusColor = 'neo-bg-green';
                        let st_lower = val.toLowerCase();
                        if (st_lower.includes('lulus')) statusColor = 'neo-bg-blue';
                        else if (st_lower.includes('pensiun')) statusColor = 'neo-bg-purple';
                        else if (st_lower.includes('cuti') || st_lower.includes('belajar') || st_lower.includes('tb') || st_lower.includes('tetap')) statusColor = 'neo-bg-pink'; // Khusus Tetap
                        else if (st_lower.includes('do') || st_lower.includes('keluar')) statusColor = 'neo-bg-pink';
                        
                        displayVal = `<span class="neo-badge ${statusColor}" style="font-size:1rem; padding: 6px 15px; color: ${statusColor === 'neo-bg-purple' ? '#fff' : '#000'}">${val}</span>`;
                    }

                    tableHtml += `
                    <tr>
                        <td class="neo-bg-yellow" style="width: 35%; font-weight: 900; font-size:1.1rem; border-right: 4px solid #000; border-bottom: 4px solid #000;">${field.label}</td>
                        <td style="font-weight: 800; font-size:1.1rem; border-bottom: 4px solid #000;">${displayVal}</td>
                    </tr>`;
                });

                document.getElementById('d-foto').src = fotoUrl;
                document.getElementById('d-nama').innerText = namaVal;
                document.getElementById('d-nim').innerText = identitasVal;
                document.getElementById('dynamic-tbody').innerHTML = tableHtml;
                document.getElementById('riwayat-container').innerHTML = riwayatHtml;

            } else {
                document.getElementById('d-nama').innerText = "Data Tidak Ditemukan";
                document.getElementById('dynamic-tbody').innerHTML = `<tr><td class="text-center neo-bg-pink" style="font-weight: 700;">Data tidak ada di dalam database.</td></tr>`;
            }
        } catch(e) {
            document.getElementById('d-nama').innerText = "Gangguan Server";
            document.getElementById('dynamic-tbody').innerHTML = `<tr><td class="text-center neo-bg-pink" style="font-weight: 700;">Gagal menghubungi server database.</td></tr>`;
        }
    });
</script>
<!-- Script Protect DevTools -->
<script src="/js/protect-devtools.js"></script>
</body>
</html>
