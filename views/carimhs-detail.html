<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Mahasiswa | PDDIKTI BEM</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/mainV5.css">
</head>
<body class="neo-bg-bg" style="display: flex; justify-content: center; padding: 50px 20px;">

    <div class="neo-card neo-bg-white" id="detail-container" style="max-width: 650px; width: 100%; position: relative; padding: 50px;">
        <a href="/carimhs" class="neo-btn neo-bg-yellow" style="position: absolute; top: -20px; left: 20px; text-decoration:none; padding: 12px 25px; font-size: 1rem;">⬅ KEMBALI</a>
        
        <div style="text-align: center; margin-top: 20px; margin-bottom: 40px;">
            <img id="d-foto" src="/img/bemprofilmhs.png" style="width: 140px; height: 140px; border-radius: 50%; border: 5px solid #000; box-shadow: 5px 5px 0px #000; background: var(--bg-blue); margin: 0 auto 20px; display:block; object-fit: cover;">
            <h1 class="neo-heading" id="d-nama" style="font-size: 2.2rem; line-height:1.2;">Memuat...</h1>
            <h2 class="neo-heading-sm" id="d-nim" style="color: var(--text-muted); font-family: 'Space Mono', monospace; font-size: 1.5rem; margin-top:10px;">-</h2>
        </div>

        <table class="neo-table" style="width: 100%; border: 4px solid #000;">
            <tbody>
                <tr>
                    <td class="neo-bg-yellow" style="width: 35%; font-weight: 900; font-size:1.1rem; border-right: 4px solid #000; border-bottom: 4px solid #000;">Angkatan</td>
                    <td id="d-angkatan" style="font-weight: 800; font-size:1.1rem; border-bottom: 4px solid #000;">-</td>
                </tr>
                <tr>
                    <td class="neo-bg-yellow" style="font-weight: 900; font-size:1.1rem; border-right: 4px solid #000; border-bottom: 4px solid #000;">Program Studi</td>
                    <td id="d-prodi" style="font-weight: 800; font-size:1.1rem; border-bottom: 4px solid #000;">-</td>
                </tr>
                <tr>
                    <td class="neo-bg-yellow" style="font-weight: 900; font-size:1.1rem; border-right: 4px solid #000;">Status Terkini</td>
                    <td id="d-status" style="font-weight: 800; font-size:1.1rem;">-</td>
                </tr>
            </tbody>
        </table>

        <div style="text-align: center; margin-top: 40px; border-top: 4px dashed #000; padding-top: 20px;">
            <p style="font-weight: 800; font-size: 1rem; color: #1e1e1e;">Sumber Data: Database Resmi BEM KBMFKG UMI</p>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const nim = urlParams.get('nim');

        if(!nim) {
            document.getElementById('d-nama').innerText = "Data Tidak Valid";
            return;
        }

        try {
            let apiUrl = `/api/mhs/${nim}`;
            if(window.location.origin === "null") apiUrl = `https://bemkbmfkgumi.com${apiUrl}`;

            const res = await fetch(apiUrl);
            const json = await res.json();

            if(json.success) {
                const d = json.data;
                document.getElementById('d-foto').src = d.foto || '/img/bemprofilmhs.png';
                document.getElementById('d-nama').innerText = d.nama;
                document.getElementById('d-nim').innerText = d.nim;
                document.getElementById('d-angkatan').innerText = d.angkatan;
                document.getElementById('d-prodi').innerText = d.prodi;
                
                let statusColor = d.status.toLowerCase() === 'aktif' ? 'neo-bg-green' : (d.status.toLowerCase() === 'lulus' ? 'neo-bg-blue' : (d.status.toLowerCase() === 'cuti' ? 'neo-bg-yellow' : 'neo-bg-pink'));
                document.getElementById('d-status').innerHTML = `<span class="neo-badge ${statusColor}" style="font-size:1rem; padding: 6px 15px;">${d.status}</span>`;
            } else {
                document.getElementById('d-nama').innerText = "Mahasiswa Tidak Ditemukan";
            }
        } catch(e) {
            document.getElementById('d-nama').innerText = "Gangguan Server";
        }
    });
</script>
<!-- Script Protect DevTools -->
<script src="/js/protect-devtools.js"></script>
</body>
</html>
