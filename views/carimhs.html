<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data Mahasiswa | DATABASE BEM</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS Neubrutalism -->
    <link rel="stylesheet" href="/css/mainV5.css">
</head>
<body class="neo-bg-bg" style="display: flex; flex-direction: column; align-items: center; padding: 40px 20px;">

    <!-- HEADER / HERO -->
    <div class="neo-card neo-bg-yellow text-center" style="max-width: 800px; width: 100%; margin-bottom: 40px; padding: 50px 30px;">
        <img src="/img/bemfkgumi.png" alt="Logo" style="width: 100px; height: 100px; border: 4px solid #000; border-radius: 50%; box-shadow: 4px 4px 0px #000; margin-bottom: 20px;">
        <h1 class="neo-heading" style="font-size: 2.8rem; margin-bottom: 10px;">PORTAL MHS BEM</h1>
        <p class="neo-subtitle" style="font-weight: 700; color: #1e1e1e;">Pencarian Terpusat Database Mahasiswa KBMFKG UMI.</p>
        
        <div style="display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center;">
            <input type="text" id="search-input" class="neo-input" placeholder="Masukkan NIM, Nama, atau Tahun Angkatan (Cth: 2020)..." style="max-width: 500px; font-size: 1.2rem; padding: 20px; border-radius: 12px; border-width: 4px;" onkeypress="handleEnter(event)">
            <button class="neo-btn neo-bg-blue" style="font-size: 1.2rem; padding: 20px 40px;" onclick="searchData()">CARI DATA 🔍</button>
        </div>
    </div>

    <!-- RESULT CONTAINER -->
    <div id="result-container" style="max-width: 800px; width: 100%; display: grid; gap: 20px;">
        <div class="neo-card neo-bg-white text-center" style="padding: 40px;">
            <h3 class="neo-heading-sm" style="color: var(--text-muted);">Silakan ketikkan NIM, Nama, atau Angkatan untuk memulai pencarian.</h3>
        </div>
    </div>

<script>
    function handleEnter(e) {
        if(e.key === 'Enter') searchData();
    }

    async function searchData() {
        const query = document.getElementById('search-input').value.trim();
        const container = document.getElementById('result-container');
        
        if(!query) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Form pencarian tidak boleh kosong!</h3></div>`;
            return;
        }

        container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm">Mencari data di server... ⏳</h3></div>`;

        try {
            let apiUrl = `/api/mhs?q=${encodeURIComponent(query)}`;
            if(window.location.origin === "null") apiUrl = `https://bemkbmfkgumi.com${apiUrl}`;

            const res = await fetch(apiUrl);
            const json = await res.json();

            if(json.success) {
                if(json.data.length === 0) {
                    container.innerHTML = `<div class="neo-card neo-bg-pink text-center"><h3 class="neo-heading-sm">Hasil Tidak Ditemukan.</h3><p>Tidak ada mahasiswa dengan Kata Kunci "${query}"</p></div>`;
                    return;
                }

                let html = '';
                json.data.forEach(mhs => {
                    let statusColor = mhs.status.toLowerCase() === 'aktif' ? 'neo-bg-green' : (mhs.status.toLowerCase() === 'lulus' ? 'neo-bg-blue' : (mhs.status.toLowerCase() === 'cuti' ? 'neo-bg-yellow' : 'neo-bg-pink'));
                    
                    html += `
                    <div class="neo-card neo-bg-white" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; padding: 25px 30px;">
                        <div>
                            <h2 class="neo-heading-sm" style="margin-bottom: 5px; font-size:1.5rem;">${mhs.nama}</h2>
                            <p style="font-weight:900; font-family:'Space Mono', monospace; font-size:1.1rem; color: #1e1e1e; margin:0 0 10px 0;">${mhs.nim}</p>
                            <div>
                                <span class="neo-badge neo-bg-yellow" style="margin-right: 5px;">Angkatan ${mhs.angkatan}</span>
                                <span class="neo-badge ${statusColor}">${mhs.status}</span>
                            </div>
                        </div>
                        <a href="/carimhs/detail?nim=${mhs.nim}" class="neo-btn neo-bg-blue" style="text-decoration:none; padding:15px 30px;">Lihat Detail 👁️</a>
                    </div>`;
                });
                container.innerHTML = html;
            } else { throw new Error(); }
        } catch(e) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Terjadi kesalahan jaringan/server.</h3></div>`;
        }
    }
</script>
<!-- Script Protect DevTools -->
<script src="/js/protect-devtools.js"></script>
</body>
</html>
