<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Database | BEM KBMFKG UMI</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- CSS Neubrutalism -->
    <link rel="stylesheet" href="/css/mainV5.css">
    <style>
        /* Extra Tweaks for Global Mobile View */
        .result-card-inner {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            padding: clamp(20px, 4vw, 25px) clamp(15px, 4vw, 30px);
        }
        .result-info { flex: 1 1 250px; }
        .result-btn { flex: 1 1 150px; max-width: 250px; text-align: center; }
        
        @media (max-width: 500px) {
            .result-btn { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body class="neo-bg-bg" style="display: flex; flex-direction: column; align-items: center; padding: clamp(20px, 5vw, 40px) 20px;">

    <!-- HEADER / HERO -->
    <div class="neo-card neo-bg-yellow text-center" style="max-width: 700px; width: 100%; margin-bottom: 40px; padding: clamp(30px, 6vw, 50px) clamp(15px, 5vw, 30px);">
        <img src="/img/bemfkgumi.png" alt="Logo" style="width: clamp(70px, 15vw, 90px); height: clamp(70px, 15vw, 90px); border: 4px solid #000; border-radius: 50%; box-shadow: 4px 4px 0px #000; background: #fff; object-fit: cover; margin-bottom: 15px;">
        <h1 class="neo-heading" style="font-size: clamp(2rem, 6vw, 2.8rem); margin-bottom: 10px;">PORTAL DATA BEM</h1>
        <p class="neo-subtitle" style="font-weight: 800; color: #1e1e1e; font-size: clamp(0.95rem, 3vw, 1.1rem);">Pencarian Terpusat Database Institusi KBMFKG UMI.</p>
        
        <div style="margin-top: 35px;">
            <!-- Toggle Mode Pencarian -->
            <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap;">
                <button id="btn-mode-mhs" class="neo-btn neo-bg-blue" style="flex: 1 1 200px; font-size: clamp(0.9rem, 3vw, 1.1rem); padding: 15px;" onclick="setMode('mhs')">🎓 Cari Mahasiswa</button>
                <button id="btn-mode-civ" class="neo-btn neo-bg-white" style="flex: 1 1 200px; font-size: clamp(0.9rem, 3vw, 1.1rem); padding: 15px;" onclick="setMode('civitas')">👨‍🏫 Cari Dosen/Civitas</button>
            </div>

            <!-- Form Pencarian Dinamis -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <input type="text" id="search-input" class="neo-input" placeholder="Masukkan NIM, Nama / Angkatan (Cth: 2020)" style="width: 100%; max-width: 550px; font-size: clamp(1rem, 4vw, 1.2rem); padding: 18px; border-radius: 12px; border-width: 4px; text-align: center;" onkeypress="handleEnter(event)">
                <button class="neo-btn neo-bg-green" style="font-size: clamp(1rem, 4vw, 1.2rem); padding: 15px 50px; width: 100%; max-width: 300px;" onclick="searchData()">CARI DATA 🔍</button>
            </div>
        </div>
    </div>

    <!-- RESULT CONTAINER -->
    <div id="result-container" style="max-width: 700px; width: 100%; display: grid; gap: 20px;">
        <div class="neo-card neo-bg-white text-center" style="padding: 40px;" id="default-helper-text">
            <h3 class="neo-heading-sm" style="color: var(--text-muted); font-size: clamp(1rem, 4vw, 1.2rem);">Silakan ketikkan NIM, Nama, atau Tahun Angkatan untuk memulai pencarian.</h3>
        </div>
    </div>

<script>
    let searchMode = 'mhs'; // Default State

    function setMode(mode) {
        searchMode = mode;
        const btnMhs = document.getElementById('btn-mode-mhs');
        const btnCiv = document.getElementById('btn-mode-civ');
        const input = document.getElementById('search-input');

        // Reset Hasil Pencarian jika ganti mode
        document.getElementById('result-container').innerHTML = `<div class="neo-card neo-bg-white text-center" style="padding: 40px;" id="default-helper-text"></div>`;

        if (mode === 'mhs') {
            btnMhs.className = 'neo-btn neo-bg-blue';
            btnCiv.className = 'neo-btn neo-bg-white';
            input.placeholder = 'Masukkan NIM/Nama/Angkatan (Cth: 2020)';
            document.getElementById('default-helper-text').innerHTML = `<h3 class="neo-heading-sm" style="color: var(--text-muted); font-size: clamp(1rem, 4vw, 1.2rem);">Silakan ketikkan NIM, Nama, atau Tahun Angkatan untuk memulai pencarian.</h3>`;
        } else {
            btnCiv.className = 'neo-btn neo-bg-blue';
            btnMhs.className = 'neo-btn neo-bg-white';
            input.placeholder = 'Masukkan NIP/NIDN/Nama/Ikatan Kerja (Cth: Dosen tetap)';
            document.getElementById('default-helper-text').innerHTML = `<h3 class="neo-heading-sm" style="color: var(--text-muted); font-size: clamp(1rem, 4vw, 1.2rem);">Silakan ketikkan NIP, NIDN, Nama, atau Ikatan Kerja untuk memulai pencarian.</h3>`;
        }
        
        input.value = '';
        input.focus();
    }

    function handleEnter(e) {
        if(e.key === 'Enter') searchData();
    }

    async function searchData() {
        const query = document.getElementById('search-input').value.trim();
        const container = document.getElementById('result-container');
        
        if(!query) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Form pencarian tidak boleh kosong!</h3></div>`;
            return;
        }

        container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm">Mencari data di server... ⏳</h3></div>`;

        try {
            // Memanggil API Backend V2 berdasarkan Mode (Mhs / Civitas)
            let endpoint = searchMode === 'mhs' ? `/api/mhs?q=${encodeURIComponent(query)}` : `/api/civitas?q=${encodeURIComponent(query)}`;
            let apiUrl = window.location.origin === "null" ? `https://bemkbmfkgumi.com${endpoint}` : endpoint;

            const res = await fetch(apiUrl);
            const json = await res.json();

            if(json.success) {
                if(json.data.length === 0) {
                    let tipeTeks = searchMode === 'mhs' ? 'mahasiswa' : 'dosen/civitas';
                    container.innerHTML = `<div class="neo-card neo-bg-pink text-center"><h3 class="neo-heading-sm">Hasil Tidak Ditemukan.</h3><p style="font-weight:700;">Tidak ada data ${tipeTeks} yang cocok dengan kata kunci "${query}"</p></div>`;
                    return;
                }

                let html = '';
                json.data.forEach(item => {
                    
                    let d_id = '-';
                    let d_nama = '-';
                    let d_desc = '-'; 
                    let d_status = 'Aktif';
                    let d_tipe = ''; // Khusus Pegawai
                    let d_tipe_url = searchMode; // Parameter URL spesifik (mhs / dosen / civitas)

                    if (searchMode === 'mhs') {
                        d_id = item.nim || item.NIM || '-';
                        for(let key in item) {
                            let k = key.toLowerCase();
                            if(k.includes('nama')) d_nama = item[key];
                            if(k.includes('angkat') || k.includes('tahun')) d_desc = `Angkatan ${item[key]}`;
                            if(k.includes('status')) d_status = item[key];
                        }
                    } else {
                        // Prioritas Pencarian ID Pegawai
                        d_tipe = (item.tipe_pegawai || 'civitas');
                        d_tipe_url = d_tipe.toLowerCase();
                        
                        if (d_tipe_url === 'dosen') {
                            d_id = item.nidn || item.NIDN || item.nip || item.NIP || '-';
                        } else {
                            d_id = item.nip || item.NIP || item.nidn || item.NIDN || '-';
                        }
                        
                        d_tipe = d_tipe.toUpperCase();

                        for(let key in item) {
                            let k = key.toLowerCase();
                            if(k.includes('nama')) d_nama = item[key];
                            if(k.includes('prodi') || k.includes('unit')) d_desc = item[key];
                            if(k.includes('status')) d_status = item[key];
                        }
                    }

                    // Logika Pewarnaan Badge Status
                    let statusColor = 'neo-bg-green'; 
                    let st_lower = d_status.toLowerCase();
                    if (st_lower.includes('lulus')) statusColor = 'neo-bg-blue';
                    else if (st_lower.includes('pensiun')) statusColor = 'neo-bg-purple';
                    else if (st_lower.includes('cuti') || st_lower.includes('belajar') || st_lower.includes('tb')) statusColor = 'neo-bg-yellow';
                    else if (st_lower.includes('do') || st_lower.includes('keluar')) statusColor = 'neo-bg-pink';
                    
                    let descBadge = searchMode === 'mhs' 
                        ? `<span class="neo-badge neo-bg-yellow" style="margin-right: 8px; margin-bottom: 8px; font-size: 0.9rem; padding: 6px 14px;">${d_desc}</span>`
                        : `<span class="neo-badge neo-bg-white" style="margin-right: 8px; margin-bottom: 8px; font-size: 0.9rem; padding: 6px 14px;">${d_desc}</span>`;
                        
                    let typeBadgeHtml = searchMode === 'civitas' 
                        ? `<span class="neo-badge neo-bg-blue" style="margin-right: 8px; margin-bottom: 8px; font-size: 0.9rem; padding: 6px 14px;">${d_tipe}</span>` 
                        : '';
                    
                    // Membuat nama parameter URL Dinamis (nim / nidn / nip)
                    let urlParamName = 'nim';
                    if (searchMode !== 'mhs') {
                        urlParamName = d_tipe_url === 'dosen' ? 'nidn' : 'nip';
                    }

                    html += `
                    <div class="neo-card neo-bg-white result-card-inner">
                        <div class="result-info">
                            <h2 class="neo-heading-sm" style="margin-bottom: 5px; font-size:clamp(1.3rem, 4vw, 1.6rem); color: #000;">${d_nama}</h2>
                            <p style="font-weight:900; font-family:'Space Mono', monospace; font-size:clamp(1rem, 3vw, 1.1rem); color: var(--text-muted); margin:0 0 15px 0;">${d_id}</p>
                            
                            <!-- BADGES INFO -->
                            <div style="display:flex; flex-wrap:wrap;">
                                ${typeBadgeHtml}
                                ${descBadge}
                                <span class="neo-badge ${statusColor}" style="margin-bottom: 8px; font-size: 0.9rem; padding: 6px 14px; color: ${statusColor === 'neo-bg-purple' ? '#fff' : '#000'}">${d_status}</span>
                            </div>
                        </div>
                        <a href="/carimhs/detail?${urlParamName}=${encodeURIComponent(d_id)}&type=${d_tipe_url}" class="neo-btn neo-bg-blue result-btn" style="text-decoration:none; padding:12px 25px; font-size: 1rem;">Lihat Detail 👁️</a>
                    </div>`;
                });
                
                let tipeTeks = searchMode === 'mhs' ? 'Mahasiswa' : 'Pegawai';
                const resultHeader = `<div style="text-align:left; font-weight:800; font-size:1.1rem; color:var(--text-main); margin-bottom:-5px; padding-left:10px;">Menemukan ${json.data.length} Data ${tipeTeks}</div>`;
                
                container.innerHTML = resultHeader + html;
            } else { throw new Error(); }
        } catch(e) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Terjadi kesalahan jaringan/server.</h3><p>Gagal menghubungi database Upstash Redis.</p></div>`;
        }
    }
</script>
<!-- Script Protect DevTools -->
<script src="/js/protect-devtools.js"></script>
</body>
</html>
