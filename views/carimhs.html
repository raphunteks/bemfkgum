<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data Mahasiswa | PDDIKTI BEM</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- CSS Neubrutalism -->
    <link rel="stylesheet" href="/css/mainV5.css">
</head>
<body class="neo-bg-bg" style="display: flex; flex-direction: column; align-items: center; padding: 40px 20px;">

    <!-- HEADER / HERO -->
    <div class="neo-card neo-bg-yellow text-center" style="max-width: 800px; width: 100%; margin-bottom: 40px; padding: 50px 30px;">
        <img src="/img/bemfkgumi.png" alt="Logo" style="width: 100px; height: 100px; border: 4px solid #000; border-radius: 50%; box-shadow: 4px 4px 0px #000; background: #fff; object-fit: cover; margin-bottom: 20px;">
        <h1 class="neo-heading" style="font-size: 2.8rem; margin-bottom: 10px;">PORTAL MHS BEM</h1>
        <p class="neo-subtitle" style="font-weight: 800; color: #1e1e1e; font-size: 1.1rem;">Pencarian Terpusat Database Mahasiswa KBMFKG UMI.</p>
        
        <div style="display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center;">
            <!-- Form Pencarian Mendukung NIM, Nama, dan Angkatan -->
            <input type="text" id="search-input" class="neo-input" placeholder="Masukkan NIM, Nama, atau Angkatan (Cth: 2020)..." style="max-width: 500px; font-size: 1.2rem; padding: 20px; border-radius: 12px; border-width: 4px;" onkeypress="handleEnter(event)">
            <button class="neo-btn neo-bg-blue" style="font-size: 1.2rem; padding: 20px 40px;" onclick="searchData()">CARI DATA 🔍</button>
        </div>
    </div>

    <!-- RESULT CONTAINER -->
    <div id="result-container" style="max-width: 800px; width: 100%; display: grid; gap: 20px;">
        <div class="neo-card neo-bg-white text-center" style="padding: 40px;">
            <h3 class="neo-heading-sm" style="color: var(--text-muted);">Silakan ketikkan NIM, Nama, atau Tahun Angkatan untuk memulai pencarian.</h3>
        </div>
    </div>

<script>
    function handleEnter(e) {
        if(e.key === 'Enter') searchData();
    }

    async function searchData() {
        const query = document.getElementById('search-input').value.trim();
        const container = document.getElementById('result-container');
        
        if(!query) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Form pencarian tidak boleh kosong!</h3></div>`;
            return;
        }

        container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm">Mencari data di server... ⏳</h3></div>`;

        try {
            // Memanggil API Backend V2 yang sudah dioptimasi untuk Smart Search
            let apiUrl = `/api/mhs?q=${encodeURIComponent(query)}`;
            if(window.location.origin === "null") apiUrl = `https://bemkbmfkgumi.com${apiUrl}`;

            const res = await fetch(apiUrl);
            const json = await res.json();

            if(json.success) {
                if(json.data.length === 0) {
                    container.innerHTML = `<div class="neo-card neo-bg-pink text-center"><h3 class="neo-heading-sm">Hasil Tidak Ditemukan.</h3><p style="font-weight:700;">Tidak ada data mahasiswa yang cocok dengan kata kunci "${query}"</p></div>`;
                    return;
                }

                let html = '';
                json.data.forEach(mhs => {
                    
                    // ===============================================================
                    // SMART EXTRACTION: Mendeteksi isi data walau ID Form-nya dinamis
                    // ===============================================================
                    let d_nim = mhs.nim || mhs.NIM || '-';
                    let d_nama = '-';
                    let d_angkatan = '-';
                    let d_status = 'Aktif';

                    for(let key in mhs) {
                        let k = key.toLowerCase();
                        if(k.includes('nama')) d_nama = mhs[key];
                        if(k.includes('angkat') || k.includes('tahun')) d_angkatan = mhs[key];
                        if(k.includes('status')) d_status = mhs[key];
                    }

                    // Logika Pewarnaan Badge Status
                    let statusColor = 'neo-bg-green'; // Default Aktif
                    if (d_status.toLowerCase().includes('lulus')) statusColor = 'neo-bg-blue';
                    else if (d_status.toLowerCase().includes('cuti')) statusColor = 'neo-bg-yellow';
                    else if (d_status.toLowerCase().includes('do') || d_status.toLowerCase().includes('keluar')) statusColor = 'neo-bg-pink';
                    
                    html += `
                    <div class="neo-card neo-bg-white" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; padding: 25px 30px;">
                        <div>
                            <h2 class="neo-heading-sm" style="margin-bottom: 5px; font-size:1.6rem; color: #000;">${d_nama}</h2>
                            <p style="font-weight:900; font-family:'Space Mono', monospace; font-size:1.1rem; color: var(--text-muted); margin:0 0 15px 0;">${d_nim}</p>
                            
                            <!-- BADGE ANGKATAN & STATUS SESUAI GAMBAR 1 -->
                            <div>
                                <span class="neo-badge neo-bg-yellow" style="margin-right: 8px; font-size: 0.95rem; padding: 6px 14px;">Angkatan ${d_angkatan}</span>
                                <span class="neo-badge ${statusColor}" style="font-size: 0.95rem; padding: 6px 14px;">${d_status}</span>
                            </div>
                        </div>
                        <a href="/carimhs/detail?nim=${d_nim}" class="neo-btn neo-bg-blue" style="text-decoration:none; padding:15px 35px; font-size: 1.1rem;">Lihat Detail 👁️</a>
                    </div>`;
                });
                
                // Menambahkan informasi jumlah temuan data di atas hasil pencarian
                const resultHeader = `<div style="text-align:left; font-weight:800; font-size:1.1rem; color:var(--text-main); margin-bottom:-5px; padding-left:10px;">Menemukan ${json.data.length} Mahasiswa</div>`;
                
                container.innerHTML = resultHeader + html;
            } else { throw new Error(); }
        } catch(e) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Terjadi kesalahan jaringan/server.</h3><p>Gagal menghubungi database Upstash Redis.</p></div>`;
        }
    }
</script>
<!-- Script Protect DevTools -->
<script src="/js/protect-devtools.js"></script>
</body>
</html>
