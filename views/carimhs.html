<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data Terpadu | PDDIKTI BEM</title>
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- CSS Neubrutalism -->
    <link rel="stylesheet" href="/css/mainV5.css">
</head>
<body class="neo-bg-bg" style="display: flex; flex-direction: column; align-items: center; padding: 40px 20px;">

    <!-- HEADER / HERO -->
    <div class="neo-card neo-bg-yellow text-center" style="max-width: 800px; width: 100%; margin-bottom: 40px; padding: 50px 30px;">
        <img src="/img/bemfkgumi.png" alt="Logo" style="width: 100px; height: 100px; border: 4px solid #000; border-radius: 50%; box-shadow: 4px 4px 0px #000; background: #fff; object-fit: cover; margin-bottom: 20px;">
        <h1 class="neo-heading" style="font-size: 2.8rem; margin-bottom: 10px;">PORTAL DATA BEM</h1>
        <p class="neo-subtitle" style="font-weight: 800; color: #1e1e1e; font-size: 1.1rem;">Pencarian Terpusat Database Institusi KBMFKG UMI.</p>
        
        <!-- ================= PILIHAN TAB ENTITAS ================= -->
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 35px; flex-wrap: wrap;">
            <button id="tab-mhs" class="neo-btn neo-bg-blue" onclick="setSearchType('mhs')" style="font-size: 1.1rem; padding: 15px 30px;">🎓 Cari Mahasiswa</button>
            <button id="tab-civitas" class="neo-btn neo-bg-white" onclick="setSearchType('civitas')" style="font-size: 1.1rem; padding: 15px 30px;">👨‍🏫 Cari Dosen/Civitas</button>
        </div>
        
        <!-- FORM PENCARIAN -->
        <div style="display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; justify-content: center;">
            <input type="text" id="search-input" class="neo-input" placeholder="Masukkan NIM, Nama, atau Angkatan (Cth: 2020)..." style="max-width: 500px; font-size: 1.2rem; padding: 20px; border-radius: 12px; border-width: 4px;" onkeypress="handleEnter(event)">
            <button class="neo-btn neo-bg-green" style="font-size: 1.2rem; padding: 20px 40px;" onclick="searchData()">CARI DATA 🔍</button>
        </div>
    </div>

    <!-- RESULT CONTAINER -->
    <div id="result-container" style="max-width: 800px; width: 100%; display: grid; gap: 20px;">
        <div class="neo-card neo-bg-white text-center" id="default-hint" style="padding: 40px;">
            <h3 class="neo-heading-sm" style="color: var(--text-muted);">Silakan ketikkan NIM, Nama, atau Tahun Angkatan untuk memulai pencarian.</h3>
        </div>
    </div>

<script>
    let currentSearchType = 'mhs'; // Default type

    // ================= FUNGSI GANTI TAB PENCARIAN =================
    function setSearchType(type) {
        currentSearchType = type;
        const btnMhs = document.getElementById('tab-mhs');
        const btnCivitas = document.getElementById('tab-civitas');
        const searchInput = document.getElementById('search-input');
        const hintBox = document.getElementById('result-container');

        if (type === 'mhs') {
            btnMhs.className = 'neo-btn neo-bg-blue';
            btnCivitas.className = 'neo-btn neo-bg-white';
            searchInput.placeholder = 'Masukkan NIM, Nama, atau Angkatan (Cth: 2020)...';
            hintBox.innerHTML = `<div class="neo-card neo-bg-white text-center" id="default-hint" style="padding: 40px;"><h3 class="neo-heading-sm" style="color: var(--text-muted);">Silakan ketikkan NIM, Nama, atau Tahun Angkatan untuk memulai pencarian.</h3></div>`;
        } else {
            btnMhs.className = 'neo-btn neo-bg-white';
            btnCivitas.className = 'neo-btn neo-bg-purple'; // Warna identitas Civitas
            searchInput.placeholder = 'Masukkan NIDN, Nama, Jenjang, atau Jabatan...';
            hintBox.innerHTML = `<div class="neo-card neo-bg-white text-center" id="default-hint" style="padding: 40px;"><h3 class="neo-heading-sm" style="color: var(--text-muted);">Silakan ketikkan NIDN, Nama, atau Jabatan untuk memulai pencarian Civitas/Dosen.</h3></div>`;
        }
        
        searchInput.value = '';
        searchInput.focus();
    }

    function handleEnter(e) {
        if(e.key === 'Enter') searchData();
    }

    // ================= FUNGSI PENCARIAN CERDAS (API) =================
    async function searchData() {
        const query = document.getElementById('search-input').value.trim();
        const container = document.getElementById('result-container');
        
        if(!query) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Form pencarian tidak boleh kosong!</h3></div>`;
            return;
        }

        container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm">Mencari data di server... ⏳</h3></div>`;

        try {
            // URL dinamis menyesuaikan tab yang sedang aktif (/api/mhs atau /api/civitas)
            let apiUrl = `/api/${currentSearchType}?q=${encodeURIComponent(query)}`;
            if(window.location.origin === "null") apiUrl = `https://bemkbmfkgumi.com${apiUrl}`;

            const res = await fetch(apiUrl);
            const json = await res.json();

            if(json.success) {
                if(json.data.length === 0) {
                    const labelEntitas = currentSearchType === 'mhs' ? 'Mahasiswa' : 'Civitas/Dosen';
                    container.innerHTML = `<div class="neo-card neo-bg-pink text-center"><h3 class="neo-heading-sm">Hasil Tidak Ditemukan.</h3><p style="font-weight:700;">Tidak ada data ${labelEntitas} yang cocok dengan kata kunci "${query}"</p></div>`;
                    return;
                }

                let html = '';
                json.data.forEach(item => {
                    
                    // ===============================================================
                    // SMART EXTRACTION: Pengekstrak Data Anti-Crash (MHS & CIVITAS)
                    // ===============================================================
                    let d_id = '-';
                    let d_nama = '-';
                    let d_sub1 = '-';
                    let d_sub2 = '';
                    let d_status = 'Aktif';
                    let d_foto = '/img/bemprofilmhs.png';

                    for(let key in item) {
                        let k = key.toLowerCase();
                        if(k.includes('nama')) d_nama = item[key];
                        if(k.includes('status')) d_status = item[key];
                        if(k === 'foto' || k === 'image') d_foto = item[key] !== '-' && item[key] !== '' ? item[key] : d_foto;
                        
                        // Ekstraksi khusus jika mode Mahasiswa
                        if(currentSearchType === 'mhs') {
                            if(k === 'nim' || k.includes('nim')) d_id = item[key];
                            if(k.includes('angkat') || k.includes('tahun')) d_sub1 = 'Angkatan ' + item[key];
                            if(k.includes('prodi') || k.includes('program')) d_sub2 = item[key];
                        } 
                        // Ekstraksi khusus jika mode Civitas/Dosen
                        else {
                            if(k === 'nidn' || k === 'nip' || k.includes('nidn')) d_id = item[key];
                            if(k.includes('jenjang') || k.includes('pendidikan')) d_sub1 = item[key];
                            if(k.includes('jabatan')) d_sub2 = item[key];
                        }
                    }

                    // Logika Pewarnaan Badge Status
                    let statusColor = 'neo-bg-green'; // Default Aktif
                    if (d_status.toLowerCase().includes('lulus') || d_status.toLowerCase().includes('tugas')) statusColor = 'neo-bg-blue';
                    else if (d_status.toLowerCase().includes('cuti')) statusColor = 'neo-bg-yellow';
                    else if (d_status.toLowerCase().includes('do') || d_status.toLowerCase().includes('keluar') || d_status.toLowerCase().includes('pensiun')) statusColor = 'neo-bg-pink';
                    
                    // Parameter URL untuk diarahkan ke halaman detail
                    let linkParam = currentSearchType === 'mhs' ? `nim=${d_id}` : `nidn=${d_id}`;

                    html += `
                    <div class="neo-card neo-bg-white" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; padding: 25px 30px;">
                        
                        <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                            <img src="${d_foto}" onerror="this.onerror=null;this.src='/img/bemprofilmhs.png';" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid #000; object-fit: cover; box-shadow: 3px 3px 0px #000; background: #fff;">
                            <div>
                                <h2 class="neo-heading-sm" style="margin-bottom: 5px; font-size:1.6rem; color: #000;">${d_nama}</h2>
                                <p style="font-weight:900; font-family:'Space Mono', monospace; font-size:1.1rem; color: var(--text-muted); margin:0 0 10px 0;">${d_id}</p>
                                
                                <div>
                                    <span class="neo-badge neo-bg-yellow" style="margin-right: 8px; font-size: 0.95rem; padding: 6px 14px;">${d_sub1}</span>
                                    ${d_sub2 && d_sub2 !== '-' ? `<span class="neo-badge neo-bg-white" style="margin-right: 8px; font-size: 0.95rem; padding: 6px 14px;">${d_sub2}</span>` : ''}
                                    <span class="neo-badge ${statusColor}" style="font-size: 0.95rem; padding: 6px 14px;">${d_status}</span>
                                </div>
                            </div>
                        </div>

                        <a href="/carimhs/detail?${linkParam}&type=${currentSearchType}" class="neo-btn neo-bg-blue" style="text-decoration:none; padding:15px 35px; font-size: 1.1rem;">Lihat Detail 👁️</a>
                    </div>`;
                });
                
                // Menambahkan informasi jumlah temuan data
                const typeText = currentSearchType === 'mhs' ? 'Mahasiswa' : 'Civitas/Dosen';
                const resultHeader = `<div style="text-align:left; font-weight:800; font-size:1.1rem; color:var(--text-main); margin-bottom:-5px; padding-left:10px;">Menemukan ${json.data.length} Data ${typeText}</div>`;
                
                container.innerHTML = resultHeader + html;
            } else { throw new Error(); }
        } catch(e) {
            container.innerHTML = `<div class="neo-card neo-bg-white text-center"><h3 class="neo-heading-sm" style="color: #ef4444;">Terjadi kesalahan jaringan/server.</h3><p>Gagal menghubungi database Upstash Redis.</p></div>`;
        }
    }
</script>
<!-- Script Protect DevTools -->
<script src="/js/protect-devtools.js"></script>
</body>
</html>
