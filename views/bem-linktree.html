            case 'grid-dark': return `background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.1) 1px, transparent 1px); background-color: var(--theme-bg, #0f172a);`;
            case 'polka-light': return `background-image: radial-gradient(rgba(0,0,0,0.1) 2px, transparent 2px); background-size: 20px 20px; background-color: var(--theme-bg, #ffffff);`;
            case 'polka-dark': return `background-image: radial-gradient(rgba(255,255,255,0.15) 2px, transparent 2px); background-size: 20px 20px; background-color: var(--theme-bg, #0f172a);`;
            case 'diagonal-light': return `background: repeating-linear-gradient(45deg, rgba(0,0,0,0.03), rgba(0,0,0,0.03) 10px, transparent 10px, transparent 20px); background-color: var(--theme-bg, #ffffff);`;
            case 'diagonal-dark': return `background: repeating-linear-gradient(45deg, rgba(255,255,255,0.05), rgba(255,255,255,0.05) 10px, transparent 10px, transparent 20px); background-color: var(--theme-bg, #0f172a);`;
            case 'checkerboard': return `background-image: linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)), linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)); background-size: 20px 20px; background-position: 0 0, 10px 10px; background-color: var(--theme-bg, #ffffff);`;
            case 'zigzag': return `background: linear-gradient(135deg, rgba(0,0,0,0.05) 25%, transparent 25%) -20px 0, linear-gradient(225deg, rgba(0,0,0,0.05) 25%, transparent 25%) -20px 0, linear-gradient(315deg, rgba(0,0,0,0.05) 25%, transparent 25%), linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%); background-size: 40px 40px; background-color: var(--theme-bg, #ffffff);`;
            case 'wave-light': return `background: radial-gradient(circle at 100% 50%, transparent 20%, rgba(0,0,0,0.03) 21%, rgba(0,0,0,0.03) 34%, transparent 35%, transparent), radial-gradient(circle at 0% 50%, transparent 20%, rgba(0,0,0,0.03) 21%, rgba(0,0,0,0.03) 34%, transparent 35%, transparent) 0 -50px; background-size: 100px 100px; background-color: var(--theme-bg, #ffffff);`;
            case 'wave-dark': return `background: radial-gradient(circle at 100% 50%, transparent 20%, rgba(255,255,255,0.05) 21%, rgba(255,255,255,0.05) 34%, transparent 35%, transparent), radial-gradient(circle at 0% 50%, transparent 20%, rgba(255,255,255,0.05) 21%, rgba(255,255,255,0.05) 34%, transparent 35%, transparent) 0 -50px; background-size: 100px 100px; background-color: var(--theme-bg, #0f172a);`;
            case 'topography': return `background-image: repeating-radial-gradient(circle at 0 0, transparent 0, rgba(0,0,0,0.05) 10px, transparent 11px, transparent 20px); background-color: var(--theme-bg, #ffffff);`;
            case 'memphis': return `background-image: radial-gradient(circle, rgba(0,0,0,0.1) 10%, transparent 10%), radial-gradient(circle, rgba(0,0,0,0.1) 10%, transparent 10%); background-size: 50px 50px; background-position: 0 0, 25px 25px; background-color: var(--theme-bg, #ffffff);`;
            case 'circuit': return `background-image: radial-gradient(rgba(0,0,0,0.1) 15%, transparent 16%), radial-gradient(rgba(0,0,0,0.1) 15%, transparent 16%); background-size: 30px 30px; background-position: 0 0, 15px 15px; background-color: var(--theme-bg, #ffffff);`;
            case 'starry': return `background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px); background-size: 90px 90px; background-position: 0 0, 45px 45px; background-color: #0f172a;`;
            case 'hexagons': return `background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.05) 80%, transparent 80%, transparent), radial-gradient(circle, transparent 20%, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.05) 80%, transparent 80%, transparent) 25px 25px, linear-gradient(rgba(0,0,0,0.05) 2px, transparent 2px) 0 -1px, linear-gradient(90deg, rgba(0,0,0,0.05) 2px, transparent 2px) -1px 0; background-size: 50px 50px, 50px 50px, 25px 25px, 25px 25px; background-color: var(--theme-bg, #ffffff);`;
            case 'clouds': return `background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, transparent 50%); background-size: 100px 100px; background-color: #87CEEB;`;
            case 'mesh-1': return `background-image: radial-gradient(at 40% 20%, rgba(255,100,100,0.3) 0px, transparent 50%), radial-gradient(at 80% 0%, rgba(100,255,100,0.3) 0px, transparent 50%), radial-gradient(at 0% 50%, rgba(100,100,255,0.3) 0px, transparent 50%); background-color: var(--theme-bg, #ffffff);`;
            case 'mesh-2': return `background-image: radial-gradient(at 0% 100%, rgba(255,200,0,0.3) 0px, transparent 50%), radial-gradient(at 50% 0%, rgba(0,200,255,0.3) 0px, transparent 50%); background-color: var(--theme-bg, #ffffff);`;
            case 'liquid-1': return `background: linear-gradient(45deg, rgba(255,0,0,0.1), rgba(0,0,255,0.1)); filter: contrast(1.5); background-color: var(--theme-bg, #ffffff);`;
            case 'liquid-2': return `background: linear-gradient(to right, rgba(0,255,0,0.1), rgba(255,0,255,0.1)); background-color: var(--theme-bg, #ffffff);`;
            
            // --- 10 NEW TEMPLATES ---
            case 'neo-brutalism': return `background-color: var(--theme-bg, #ffde59); background-image: radial-gradient(circle, #000 2px, transparent 2px); background-size: 30px 30px;`;
            case 'glass-blobs': return `background-color: var(--theme-bg, #f3f4f6); background-image: radial-gradient(circle at 15% 50%, rgba(255,105,180,0.4), transparent 50%), radial-gradient(circle at 85% 30%, rgba(0,255,255,0.4), transparent 50%); filter: blur(0px);`;
            case 'y2k-holo': return `background: linear-gradient(120deg, #ff00cc, #333399, #00ffff); background-size: 200% 200%; animation: gradientMove 5s ease infinite;`;
            case 'cyber-grid': return `background-color: #0d0221; background-image: linear-gradient(transparent 95%, rgba(255,0,60,0.5) 95%), linear-gradient(90deg, transparent 95%, rgba(15,56,15,0.5) 95%); background-size: 40px 40px;`;
            case 'retro-sunset': return `background: linear-gradient(to bottom, #000033 0%, #cc0066 50%, #ff9933 100%);`;
            case 'bauhaus': return `background-color: var(--theme-bg, #f4f4f4); background-image: radial-gradient(circle at 20% 20%, rgba(217,32,39,0.2) 10%, transparent 11%), linear-gradient(45deg, transparent 40%, rgba(53,208,186,0.2) 40%, rgba(53,208,186,0.2) 60%, transparent 60%); background-size: 100px 100px;`;
            case 'vhs-glitch': return `background-color: #111; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.05), rgba(255,255,255,0.05) 2px, transparent 2px, transparent 4px);`;
            case 'pastel-dream': return `background: linear-gradient(45deg, #ffc3a0 0%, #ffafbd 100%);`;
            case 'dark-academia': return `background-color: #3e2723; background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.15) 10px, rgba(0,0,0,0.15) 20px);`;
            case 'minimal-zen': return `background-color: var(--theme-bg, #fafafa); background-image: repeating-radial-gradient(circle at center, transparent 0, transparent 20px, rgba(0,0,0,0.04) 21px, rgba(0,0,0,0.04) 22px);`;
            
            default: return '';
        }
    }

    document.addEventListener('DOMContentLoaded', loadLinktreeData);

    async function loadLinktreeData() {
        try {
            const res = await fetch(`/api/linktrees/${slug}`);
            const json = await res.json();

            if(!json.success || !json.data) {
                renderError();
                return;
            }

            renderPublicLinktree(json.data);
        } catch (error) {
            renderError();
        }
    }

    function renderError() {
        document.getElementById('public-screen').innerHTML = `
            <div class="glass-card" style="text-align:center; padding:50px;">
                <h2 style="color:#ef4444; font-family:'Outfit', sans-serif;">Halaman Tidak Ditemukan</h2>
                <p style="color:var(--text-main); font-weight:600;">Linktree yang Anda cari tidak ada atau belum dipublikasikan.</p>
                <a href="/" class="btn-primary" style="display:inline-block; margin-top:20px; text-decoration:none;">Kembali ke Portal BEM</a>
            </div>
        `;
    }

    function loadGoogleFont(fontFamilyStr) {
        if(!fontFamilyStr) return;
        let fontName = fontFamilyStr.split(',')[0].replace(/'/g, "").trim();
        const sysFonts = ['Arial', 'Calibri', 'Comic Sans MS', 'Impact', 'Times New Roman'];
        if(sysFonts.includes(fontName)) return;

        const linkId = `font-${fontName.replace(/\s+/g, '')}`;
        if(!document.getElementById(linkId)) {
            try {
                const link = document.createElement('link');
                link.id = linkId;
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}:wght@400;600;700;800&display=swap`;
                document.head.appendChild(link);
            } catch(e) {}
        }
    }

    function renderPublicLinktree(data) {
        const wrapper = document.getElementById('page-wrapper');
        const screen = document.getElementById('public-screen');
        const t = data.theme;

        // Reset Styles & Background Rendering
        wrapper.classList.remove('has-bg-image');
        wrapper.style.background = ''; 
        wrapper.style.backgroundColor = t.bgColor; // default fallback

        if (t.bgType === 'color') {
            wrapper.style.backgroundColor = t.bgColor;
        } else if (t.bgType === 'gradient') {
            wrapper.style.background = `linear-gradient(135deg, ${t.bgColor}, #ffffff)`;
        } else if (t.bgType === 'image' && t.bgImage) {
            wrapper.style.background = `url('${t.bgImage}') no-repeat center center / cover`;
            wrapper.classList.add('has-bg-image');
        } else if (t.bgType === 'template') {
            wrapper.style.setProperty('--theme-bg', t.bgColor);
            let cssTpl = getTemplateCSS(t.bgTemplate);
            if(cssTpl) {
                wrapper.setAttribute('style', `background-color: ${t.bgColor}; ${cssTpl} color: ${t.textColor};`);
            }
        }

        try {
            loadGoogleFont(t.fontTitle);
            loadGoogleFont(t.fontButton);
        } catch(e) {}

        wrapper.style.color = t.textColor;

        let html = '';

        // Profile Section
        html += `<img id="pv-profile-img" src="${data.profile.image || '/img/bemfkgumi.png'}" alt="Profile" onerror="this.onerror=null;this.src='/img/bemfkgumi.png';">`;
        html += `<h2 id="pv-title" style="font-family:${t.fontTitle}; color:${t.textColor}">${data.profile.title || '@namaprofil'}</h2>`;
        html += `<p id="pv-bio" style="font-family:${t.fontButton}; color:${t.textColor}">${data.profile.bio || ''}</p>`;

        // Link Buttons Logic (35 TYPES CSS GENERATOR - FIXED BORDER RADIUS OVERRIDE)
        let btnCssObj = `font-family:${t.fontButton}; display:flex; align-items:center; justify-content:center; position:relative; `;
        let bg = t.btnColor;
        let borderC = t.borderColor || '#0f172a';
        let txt = t.textColor;

        switch(t.btnType) {
            case 'filled': btnCssObj += `background:${bg}; color:${txt}; border:none;`; break;
            case 'outline': btnCssObj += `background:transparent; color:${txt}; border:2px solid ${borderC};`; break;
            case 'neumorph': btnCssObj += `background:rgba(255,255,255,0.4); color:${txt}; border:1px solid rgba(255,255,255,0.6); box-shadow: 4px 4px 10px rgba(0,0,0,0.05), inset 1px 1px 1px rgba(255,255,255,0.5); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);`; break;
            case 'soft': btnCssObj += `background:${bg}33; color:${bg}; border:none;`; break;
            case 'ghost': btnCssObj += `background:transparent; color:${txt}; border:none; text-decoration:underline;`; break;
            case 'gradient-x': btnCssObj += `background:linear-gradient(90deg, ${bg}, #ffffff); color:${txt}; border:none;`; break;
            case 'gradient-y': btnCssObj += `background:linear-gradient(180deg, ${bg}, #000000); color:#fff; border:none;`; break;
            case '3d': btnCssObj += `background:${bg}; color:#fff; border:none; border-bottom:4px solid ${borderC}; transform:translateY(-2px);`; break;
            case 'shadow-hard': btnCssObj += `background:${bg}; color:#fff; border:2px solid ${borderC}; box-shadow: 6px 6px 0px ${borderC};`; break;
            case 'shadow-soft': btnCssObj += `background:${bg}; color:#fff; border:none; box-shadow: 0 10px 25px ${bg}80;`; break;
            case 'neon': btnCssObj += `background:transparent; color:${bg}; border:2px solid ${borderC}; box-shadow: 0 0 10px ${borderC}, inset 0 0 10px ${borderC}; text-shadow: 0 0 5px ${bg};`; break;
            case 'retro': btnCssObj += `background:${bg}; color:${txt}; border:3px solid ${borderC}; box-shadow: 4px 4px 0px ${borderC};`; break;
            case 'glass': btnCssObj += `background:rgba(255,255,255,0.1); color:${txt}; border:1px solid rgba(255,255,255,0.4); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);`; break;
            case 'wireframe': btnCssObj += `background:transparent; color:${txt}; border:2px dashed ${borderC};`; break;
            case 'brutalism': btnCssObj += `background:${bg}; color:${txt}; border:3px solid ${borderC}; box-shadow: 6px 6px 0px ${borderC};`; break;
            case 'glow': btnCssObj += `background:${bg}; color:#fff; border:none; box-shadow: 0 0 25px ${bg};`; break;
            case 'elegant': btnCssObj += `background:#0f172a; color:${bg}; border:1px solid ${borderC};`; break;
            case 'metallic': btnCssObj += `background:linear-gradient(135deg, #e2e8f0, #94a3b8); color:#0f172a; border:1px solid ${borderC}; box-shadow:inset 2px 2px 5px #fff;`; break;
            case 'mesh': btnCssObj += `background:radial-gradient(circle at top left, ${bg}, transparent), radial-gradient(circle at bottom right, #fff, transparent); background-color:#e2e8f0; color:#000; border:none;`; break;
            case 'duotone': btnCssObj += `background:linear-gradient(45deg, ${bg}, #fcd34d); color:#fff; border:none;`; break;
            case 'holographic': btnCssObj += `background:linear-gradient(135deg, #fbcfe8, #c4b5fd, #86efac); color:#0f172a; border:none; box-shadow:0 10px 20px rgba(0,0,0,0.1);`; break;
            case 'dark-neu': btnCssObj += `background:#1e293b; color:${bg}; border:1px solid #334155; box-shadow: 5px 5px 10px #0f172a, -5px -5px 10px #334155;`; break;
            case 'frosted': btnCssObj += `background:rgba(255,255,255,0.2); color:${txt}; border:1px solid rgba(255,255,255,0.6); border-top:1px solid #fff; border-left:1px solid #fff; backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); box-shadow:0 8px 32px rgba(0,0,0,0.1);`; break;
            case 'minimal': btnCssObj += `background:transparent; color:${txt}; border-bottom:2px solid ${borderC}; padding-left:0; padding-right:0;`; break;
            case 'thick-border': btnCssObj += `background:transparent; color:${txt}; border:4px solid ${borderC}; font-weight:900;`; break;
            case 'shadow-pop': btnCssObj += `background:${bg}; color:#fff; border:2px solid ${borderC}; box-shadow: 4px 4px 0px rgba(0,0,0,0.1);`; break;
            case 'inner-glow': btnCssObj += `background:${bg}; color:#fff; border:none; box-shadow: inset 0 0 15px rgba(255,255,255,0.8);`; break;
            case 'candy': btnCssObj += `background:linear-gradient(to right, #fbcfe8, #f9a8d4); color:#be185d; border:none; box-shadow: 0 10px 15px #fbcfe8;`; break;
            case 'midnight': btnCssObj += `background:#020617; color:${bg}; border:1px solid ${borderC}; box-shadow: 0 0 15px ${bg}40;`; break;
            case 'velvet': btnCssObj += `background:${bg}; color:#fff; border:none; opacity:0.9; filter:saturate(1.2);`; break;
            case 'neobrutalism': btnCssObj += `background:${bg}; color:${txt}; border:4px solid ${borderC}; box-shadow: 8px 8px 0px ${borderC}; font-weight:900;`; break;
            case 'glass-outline': btnCssObj += `background:rgba(255,255,255,0.05); color:${txt}; border:2px solid rgba(255,255,255,0.8); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);`; break;
            case 'pastel': btnCssObj += `background:linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%); color:#000; border:none; box-shadow: 0 5px 15px rgba(0,0,0,0.05);`; break;
            case 'cyberpunk': btnCssObj += `background:#fef08a; color:#000; border:2px solid #000; border-right:6px solid #ef4444; border-bottom:6px solid #3b82f6;`; break;
            case 'hologram-dark': btnCssObj += `background:linear-gradient(45deg, #1e1b4b, #312e81, #4c1d95); color:#fff; border:1px solid #6366f1; box-shadow:0 0 20px #4c1d95;`; break;
            default: btnCssObj += `background:${bg}; color:#fff; border:none;`;
        }

        html += `<div id="pv-links-container" style="margin-top:40px;">`;
        if(data.links && Array.isArray(data.links)) {
            data.links.forEach(l => {
                if(l.active) {
                    let renderIcon = '';
                    if(l.icon) {
                        if(l.icon.startsWith('svg:')) {
                            let k = l.icon.split(':')[1];
                            if(svgIconsCollection[k]) {
                                renderIcon = `<div class="pv-link-icon svg-icon" style="color:inherit;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">${svgIconsCollection[k]}</svg></div>`;
                            }
                        } else {
                            renderIcon = `<img src="${l.icon}" class="pv-link-icon" onerror="this.onerror=null;this.src='/img/bemfkgumi.png';">`;
                        }
                    }

                    html += `<a href="${l.url || '#'}" target="_blank" class="pv-btn btn-shape-${t.btnShape}" style="${btnCssObj}">
                                ${renderIcon}
                                <span style="flex:1; text-align:center;">${l.title || 'Untitled Link'}</span>
                             </a>`;
                }
            });
        }
        html += `</div>`;

        // Socials Logic
        if(data.socials && data.socials.length > 0) {
            html += `<div id="pv-socials" style="margin-top:50px;">`;
            data.socials.forEach(s => {
                if(s.url && socialIconsMap[s.platform]) {
                    let fullUrl = s.url;
                    if(s.platform === 'whatsapp' && !s.url.includes('wa.me')) fullUrl = `https://wa.me/${s.url}`;
                    if(s.platform === 'email' && !s.url.includes('mailto:')) fullUrl = `mailto:${s.url}`;

                    html += `<a href="${fullUrl}" target="_blank" class="pv-social-icon" style="color:${t.textColor}">
                                <svg viewBox="0 0 24 24">${socialIconsMap[s.platform]}</svg>
                             </a>`;
                }
            });
            html += `</div>`;
        }

        // Footer Watermark Logic 
        const fText = data.settings?.footerText || "Powered by BEM KBMFKG UMI (Dept. Infocom)";
        const fUrl = data.settings?.footerUrl || "https://www.bemkbmfkgumi.com/ourteam";

        html += `<div style="text-align:center; margin-top:80px; opacity:0.6; font-size:0.8rem; font-weight:600; font-family:${t.fontButton}; padding-bottom:30px;">
                    <a href="${fUrl}" target="_blank" style="color:${t.textColor}; text-decoration:none;">${fText}</a>
                 </div>`;

        screen.innerHTML = html;

        // ================= DYNAMIC SEO JSON-LD INJECTION (GOLD STANDARD GSC) =================
        const pageUrl = window.location.href;
        const orgName = "BEM KBMFKG UMI";

        const existingSchema = document.getElementById('dynamic-schema');
        if(existingSchema) existingSchema.remove();

        let sitelinks = [];
        if(data.links && Array.isArray(data.links)) {
            let pos = 1;
            data.links.forEach(l => {
                if(l.active && l.url) {
                    sitelinks.push({
                        "@type": "SiteNavigationElement",
                        "position": pos++,
                        "name": l.title || "Tautan",
                        "url": l.url
                    });
                }
            });
        }

        const schemaData = {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "ProfilePage",
                    "@id": `${pageUrl}#webpage`,
                    "url": pageUrl,
                    "name": data.settings?.seoTitle || data.profile?.title || orgName,
                    "description": data.profile?.bio || "Tautan resmi BEM KBMFKG UMI",
                    "inLanguage": "id-ID",
                    "publisher": { "@id": "https://bemkbmfkgumi.com/#organization" }
                },
                {
                    "@type": "Organization",
                    "@id": "https://bemkbmfkgumi.com/#organization",
                    "name": orgName,
                    "alternateName": "Badan Eksekutif Mahasiswa Fakultas Kedokteran Gigi Universitas Muslim Indonesia",
                    "url": "https://bemkbmfkgumi.com/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://bemkbmfkgumi.com/img/bemfkgumi.png"
                    }
                },
                {
                    "@type": "BreadcrumbList",
                    "itemListElement": [
                        {
                            "@type": "ListItem",
                            "position": 1,
                            "name": "Beranda",
                            "item": "https://bemkbmfkgumi.com/"
                        },
                        {
                            "@type": "ListItem",
                            "position": 2,
                            "name": data.profile?.title || "Profil Link",
                            "item": pageUrl
                        }
                    ]
                }
            ]
        };

        if(sitelinks.length > 0) {
            schemaData["@graph"].push({
                "@type": "ItemList",
                "@id": `${pageUrl}#sitelinks`,
                "name": "Tautan Profil",
                "itemListElement": sitelinks
            });
        }

        let scriptSchema = document.createElement('script');
        scriptSchema.type = "application/ld+json";
        scriptSchema.id = "dynamic-schema";
        scriptSchema.text = JSON.stringify(schemaData);
        document.head.appendChild(scriptSchema);
    }
</script>
