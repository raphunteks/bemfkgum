<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- GOLD STANDARD SEO (Server-Side Rendered by EJS) -->
    <title><%= seo.title %></title>
    <meta name="description" content="<%= seo.desc %>">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="<%= seo.url %>">
    
    <!-- Open Graph for Facebook/WhatsApp -->
    <meta property="og:title" content="<%= seo.title %>">
    <meta property="og:description" content="<%= seo.desc %>">
    <meta property="og:image" content="<%= seo.image %>">
    <meta property="og:url" content="<%= seo.url %>">
    <meta property="og:type" content="website">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="<%= seo.title %>">
    <meta name="twitter:description" content="<%= seo.desc %>">
    <meta name="twitter:image" content="<%= seo.image %>">
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/img/bemfkgumi.png">

    <!-- CSS Master (Glassmorphism & New Types Integration) -->
    <link rel="stylesheet" href="/css/mainV3.css">
</head>
<body>

<div class="public-linktree-wrapper" id="page-wrapper">
    <div class="public-container" id="public-screen">
        <div style="text-align:center; padding: 150px 20px;">
            <div class="loader-ring glow-effect" style="border-color:var(--primary); border-top-color:transparent; margin:0 auto;"></div>
            <p style="font-weight:700; opacity:0.7; font-family:'Plus Jakarta Sans', sans-serif; margin-top:20px;">Memuat Sistem BEM KBMFKG UMI...</p>
        </div>
    </div>
</div>

<script>
    const slug = "<%= slug %>";

        'threads': '<path d="M14.61 21.05c-1.39.9-3.23 1.34-5.32 1.34-3.14 0-5.71-1-7.46-2.9C.1 17.61-.31 15.02-.31 11.97c0-2.92.51-5.38 1.53-7.37 1.05-2.04 2.65-3.32 4.79-3.32 1.83 0 3.3.84 4.41 2.54 1.13 1.73 1.69 4.18 1.69 7.31v1.65H5.8c.03 2.15.57 3.82 1.63 5 1.07 1.2 2.5 1.8 4.29 1.8 1.19 0 2.22-.26 3.08-.77a6.97 6.97 0 0 0 2.2-2.03l1.83 1.28c-.85 1.3-2.26 2.3-4.22 3zm-2.45-12.72c0-2.07-.37-3.6-1.12-4.57-.75-.98-1.75-1.48-2.99-1.48-1.22 0-2.22.51-3 1.52-.77 1.03-1.18 2.56-1.24 4.58h8.35v-.05zm9.14 5.95v-9h-2.31v9.06c0 1.28-.27 2.21-.81 2.78-.54.58-1.34.86-2.41.86-1.11 0-1.92-.29-2.44-.86-.51-.57-.77-1.5-.77-2.79v-9.05H10.1v9c0 2.05.58 3.59 1.73 4.62 1.15 1.04 2.8 1.56 4.96 1.56 2.11 0 3.73-.5 4.88-1.5 1.15-1 1.72-2.51 1.72-4.52z"/>',

        'linkedin': '<path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>',
        'facebook': '<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>'
    };

    document.addEventListener('DOMContentLoaded', loadLinktreeData);

    async function loadLinktreeData() {
        try {
            const res = await fetch(`/api/linktrees/${slug}`);
            const json = await res.json();
            
            if(!json.success || !json.data) {
                renderError();
                return;
            }

            renderPublicLinktree(json.data);
        } catch (error) {
            renderError();
        }
    }

    function renderError() {
        document.getElementById('public-screen').innerHTML = `
            <div class="glass-card" style="text-align:center; padding:50px;">
                <h2 style="color:#ef4444; font-family:'Outfit', sans-serif;">Halaman Tidak Ditemukan</h2>
                <p style="color:var(--text-main); font-weight:600;">Linktree yang Anda cari tidak ada atau belum dipublikasikan.</p>
                <a href="/" class="btn-primary" style="display:inline-block; margin-top:20px; text-decoration:none;">Kembali ke Portal BEM</a>
            </div>
        `;
    }

    function loadGoogleFont(fontFamilyStr) {
        if(!fontFamilyStr) return;
        let fontName = fontFamilyStr.split(',')[0].replace(/'/g, "").trim();
        const sysFonts = ['Arial', 'Calibri', 'Comic Sans MS', 'Impact', 'Times New Roman'];
        if(sysFonts.includes(fontName)) return;

        const linkId = `font-${fontName.replace(/\s+/g, '')}`;
        if(!document.getElementById(linkId)) {
            const link = document.createElement('link');
            link.id = linkId; link.rel = 'stylesheet';
            link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}:wght@400;600;700;800&display=swap`;
            document.head.appendChild(link);
        }
    }

    function renderPublicLinktree(data) {
        const wrapper = document.getElementById('page-wrapper');
        const screen = document.getElementById('public-screen');
        const t = data.theme;

        // Background Rendering (Identik dengan Admin Live Preview)
        if(t.bgType === 'color') {
            wrapper.style.background = t.bgColor;
            wrapper.classList.remove('has-bg-image');
        } else if (t.bgType === 'gradient') {
            wrapper.style.background = `linear-gradient(135deg, ${t.bgColor}, #ffffff)`;
            wrapper.classList.remove('has-bg-image');
        } else if (t.bgType === 'image' && t.bgImage) {
            wrapper.style.background = `url('${t.bgImage}') no-repeat center center / cover`;
            wrapper.classList.add('has-bg-image');
        } else {
            wrapper.style.background = t.bgColor;
            wrapper.classList.remove('has-bg-image');
        }

        // Load Fonts
        loadGoogleFont(t.fontTitle);
        loadGoogleFont(t.fontButton);

        // Render HTML
        wrapper.style.color = t.textColor;
        
        let html = '';

        // Profile Section
        html += `<img id="pv-profile-img" src="${data.profile.image || '/img/bemfkgumi.png'}" alt="Profile">`;
        html += `<h2 id="pv-title" style="font-family:${t.fontTitle}; color:${t.textColor}">${data.profile.title || '@namaprofil'}</h2>`;
        html += `<p id="pv-bio" style="font-family:${t.fontButton}; color:${t.textColor}">${data.profile.bio || ''}</p>`;

        // Link Buttons Logic (30 TYPES CSS GENERATOR)
        let btnCssObj = `font-family:${t.fontButton}; `;
        let bg = t.btnColor;
        let borderC = t.borderColor || '#0f172a';
        let txt = t.textColor;
        
        switch(t.btnType) {
            case 'filled': btnCssObj += `background:${bg}; color:#fff; border:none;`; break;
            case 'outline': btnCssObj += `background:transparent; color:${txt}; border:2px solid ${borderC};`; break;
            case 'neumorph': btnCssObj += `background:rgba(255,255,255,0.4); color:${txt}; border:1px solid rgba(255,255,255,0.6); box-shadow: 4px 4px 10px rgba(0,0,0,0.05), inset 1px 1px 1px rgba(255,255,255,0.5); backdrop-filter:blur(10px);`; break;
            case 'soft': btnCssObj += `background:${bg}33; color:${bg}; border:none;`; break;
            case 'ghost': btnCssObj += `background:transparent; color:${txt}; border:none; text-decoration:underline;`; break;
            case 'gradient-x': btnCssObj += `background:linear-gradient(90deg, ${bg}, #ffffff); color:#000; border:none;`; break;
            case 'gradient-y': btnCssObj += `background:linear-gradient(180deg, ${bg}, #000000); color:#fff; border:none;`; break;
            case '3d': btnCssObj += `background:${bg}; color:#fff; border:none; border-bottom:4px solid ${borderC}; transform:translateY(-2px);`; break;
            case 'shadow-hard': btnCssObj += `background:${bg}; color:#fff; border:2px solid ${borderC}; box-shadow: 6px 6px 0px ${borderC};`; break;
            case 'shadow-soft': btnCssObj += `background:${bg}; color:#fff; border:none; box-shadow: 0 10px 25px ${bg}80;`; break;
            case 'neon': btnCssObj += `background:transparent; color:${bg}; border:2px solid ${borderC}; box-shadow: 0 0 10px ${borderC}, inset 0 0 10px ${borderC}; text-shadow: 0 0 5px ${bg};`; break;
            case 'retro': btnCssObj += `background:${bg}; color:#000; border:3px solid ${borderC}; box-shadow: 4px 4px 0px ${borderC};`; break;
            case 'glass': btnCssObj += `background:rgba(255,255,255,0.1); color:${txt}; border:1px solid rgba(255,255,255,0.4); backdrop-filter:blur(20px);`; break;
            case 'wireframe': btnCssObj += `background:transparent; color:${txt}; border:2px dashed ${borderC};`; break;
            case 'brutalism': btnCssObj += `background:${bg}; color:#000; border:3px solid ${borderC}; box-shadow: 6px 6px 0px ${borderC}; border-radius:0 !important;`; break;
            case 'glow': btnCssObj += `background:${bg}; color:#fff; border:none; box-shadow: 0 0 25px ${bg};`; break;
            case 'elegant': btnCssObj += `background:#0f172a; color:${bg}; border:1px solid ${borderC};`; break;
            case 'metallic': btnCssObj += `background:linear-gradient(135deg, #e2e8f0, #94a3b8); color:#0f172a; border:1px solid ${borderC}; box-shadow:inset 2px 2px 5px #fff;`; break;
            case 'mesh': btnCssObj += `background:radial-gradient(circle at top left, ${bg}, transparent), radial-gradient(circle at bottom right, #fff, transparent); background-color:#e2e8f0; color:#000; border:none;`; break;
            case 'duotone': btnCssObj += `background:linear-gradient(45deg, ${bg}, #fcd34d); color:#fff; border:none;`; break;
            case 'holographic': btnCssObj += `background:linear-gradient(135deg, #fbcfe8, #c4b5fd, #86efac); color:#0f172a; border:none; box-shadow:0 10px 20px rgba(0,0,0,0.1);`; break;
            case 'dark-neu': btnCssObj += `background:#1e293b; color:${bg}; border:1px solid #334155; box-shadow: 5px 5px 10px #0f172a, -5px -5px 10px #334155;`; break;
            case 'frosted': btnCssObj += `background:rgba(255,255,255,0.2); color:${txt}; border:1px solid rgba(255,255,255,0.6); border-top:1px solid #fff; border-left:1px solid #fff; backdrop-filter:blur(15px); box-shadow:0 8px 32px rgba(0,0,0,0.1);`; break;
            case 'minimal': btnCssObj += `background:transparent; color:${txt}; border-bottom:2px solid ${borderC}; border-radius:0 !important; padding-left:0; padding-right:0;`; break;
            case 'thick-border': btnCssObj += `background:transparent; color:${txt}; border:4px solid ${borderC}; font-weight:900;`; break;
            case 'shadow-pop': btnCssObj += `background:${bg}; color:#fff; border:2px solid ${borderC}; box-shadow: 4px 4px 0px rgba(0,0,0,0.1);`; break;
            case 'inner-glow': btnCssObj += `background:${bg}; color:#fff; border:none; box-shadow: inset 0 0 15px rgba(255,255,255,0.8);`; break;
            case 'candy': btnCssObj += `background:linear-gradient(to right, #fbcfe8, #f9a8d4); color:#be185d; border:none; box-shadow: 0 10px 15px #fbcfe8;`; break;
            case 'midnight': btnCssObj += `background:#020617; color:${bg}; border:1px solid ${borderC}; box-shadow: 0 0 15px ${bg}40;`; break;
            case 'velvet': btnCssObj += `background:${bg}; color:#fff; border:none; opacity:0.9; filter:saturate(1.2);`; break;
            default: btnCssObj += `background:${bg}; color:#fff; border:none;`;
        }

        html += `<div id="pv-links-container" style="margin-top:40px;">`;
        if(data.links && Array.isArray(data.links)) {
            data.links.forEach(l => {
                if(l.active) {
                    html += `<a href="${l.url || '#'}" target="_blank" class="pv-btn btn-shape-${t.btnShape}" style="${btnCssObj}">${l.title || 'Untitled Link'}</a>`;
                }
            });
        }
        html += `</div>`;

        // Socials Logic (Dynamic SVG Vectors)
        if(data.socials && data.socials.length > 0) {
            html += `<div id="pv-socials" style="margin-top:50px;">`;
            data.socials.forEach(s => {
                if(s.url && socialIconsMap[s.platform]) {
                    let fullUrl = s.url;
                    if(s.platform === 'whatsapp' && !s.url.includes('wa.me')) fullUrl = `https://wa.me/${s.url}`;
                    if(s.platform === 'email' && !s.url.includes('mailto:')) fullUrl = `mailto:${s.url}`;
                    
                    html += `<a href="${fullUrl}" target="_blank" class="pv-social-icon" style="color:${t.textColor}">
                                <svg viewBox="0 0 24 24">${socialIconsMap[s.platform]}</svg>
                             </a>`;
                }
            });
            html += `</div>`;
        }

        // Footer Watermark Logic (Dinamis dari state)
        const fText = data.settings?.footerText || "Powered by BEM KBMFKG UMI (Dept. Infocom)";
        const fUrl = data.settings?.footerUrl || "https://www.bemkbmfkgumi.com/ourteam";

        html += `<div style="text-align:center; margin-top:80px; opacity:0.6; font-size:0.8rem; font-weight:600; font-family:${t.fontButton}; padding-bottom:30px;">
                    <a href="${fUrl}" target="_blank" style="color:${t.textColor}; text-decoration:none;">${fText}</a>
                 </div>`;

        screen.innerHTML = html;
    }
</script>
</body>
</html>
